// 4. MealEditMenu
// Inline overlay menu shown when a meal tile in Week view is tapped.
// Sits below the tile. Add / remove / swap entries, set serve time.
// =====================================================================
function MealEditMenu({ existing, mealType, dayKey, recipes, onAdd, onRemove, onSwap, onSetServeTime, onClose }) {
  const { useState, useEffect, useMemo, useRef } = React;
  const items = Array.isArray(existing) ? existing : [];
  const byId = useMemo(() => {
    const o = {};
    for (const r of recipes || []) o[r.id] = r;
    return o;
  }, [recipes]);

  // Pre-fill with the first entry's serve_time if any.
  const initialTime = (items[0] && items[0].serve_time) || "";
  const [serveTime, setServeTime] = useState(initialTime);
  const wrapRef = useRef(null);

  // Close on Escape and on outside click.
  useEffect(() => {
    function onKey(e) { if (e.key === "Escape") onClose && onClose(); }
    function onDoc(e) {
      if (!wrapRef.current) return;
      if (!wrapRef.current.contains(e.target)) onClose && onClose();
    }
    window.addEventListener("keydown", onKey);
    // Defer outside-click binding so the original click that opened the menu
    // doesn't immediately close it.
    const t = setTimeout(() => document.addEventListener("mousedown", onDoc), 0);
    return () => {
      window.removeEventListener("keydown", onKey);
      clearTimeout(t);
      document.removeEventListener("mousedown", onDoc);
    };
  }, [onClose]);

  function commitTime() {
    if (serveTime && /^\d{2}:\d{2}$/.test(serveTime)) {
      onSetServeTime && onSetServeTime(serveTime);
    }
  }

  return (
    <div
      ref={wrapRef}
      className="absolute left-0 right-0 z-30 mt-1 bg-cream border border-ink shadow-lg"
      style={{ top: "100%" }}
      onClick={(e) => e.stopPropagation()}
    >
      {/* Header */}
      <div className="flex items-center justify-between px-4 py-3 border-b border-border">
        <div className="font-mono text-[10px] uppercase tracking-[0.16em] text-sage">
          {v31_mealLabel(mealType)}{dayKey ? " · " + dayKey : ""}
        </div>
        <button
          type="button"
          onClick={onClose}
          aria-label="Close menu"
          style={{ minHeight: 44, minWidth: 44 }}
          className="w-11 h-11 flex items-center justify-center text-sage hover:text-terra"
        >
          ×
        </button>
      </div>

      {/* Existing entries */}
      {items.length > 0 && (
        <div className="flex flex-col">
          {items.map((entry, i) => {
            const r = byId[entry.recipeId];
            const role = (entry.role || "main").toLowerCase();
            const photo = r ? v31_recipePhoto(r, 200) : null;
            return (
              <div
                key={(entry.recipeId || "x") + ":" + i}
                className="grid grid-cols-[44px_auto_1fr_auto_auto] gap-3 items-center px-4 py-3 border-b border-border last:border-b-0"
              >
                <div className="relative w-11 h-11 bg-sand">
                  {photo && <img src={photo} alt="" className="absolute inset-0 w-full h-full object-cover" />}
                </div>
                <span className={
                  "font-mono text-[9px] uppercase tracking-[0.14em] px-1.5 py-1 border " +
                  (role === "main" ? "border-terra text-terra" : "border-border text-warm")
                }>
                  {role}
                </span>
                <div className="font-display text-[15px] leading-tight text-ink truncate">
                  {r ? r.name : entry.recipeId}
                </div>
                <button
                  type="button"
                  onClick={() => onSwap && onSwap(entry)}
                  style={{ minHeight: 44 }}
                  className="font-mono text-[10px] uppercase tracking-[0.16em] px-3 py-2 border border-border text-ink hover:bg-bg0"
                >
                  Swap
                </button>
                <button
                  type="button"
                  onClick={() => onRemove && onRemove(entry)}
                  aria-label="Remove"
                  style={{ minHeight: 44, minWidth: 44 }}
                  className="w-11 h-11 flex items-center justify-center text-sage hover:text-terra border border-border"
                >
                  ×
                </button>
              </div>
            );
          })}
        </div>
      )}

      {/* Add button */}
      <button
        type="button"
        onClick={() => onAdd && onAdd()}
        style={{ minHeight: 44 }}
        className="w-full text-left px-4 py-4 border-b border-border font-display text-[16px] text-terra hover:bg-bg0"
      >
        + Add recipe
      </button>

      {/* Serve time */}
      <div className="px-4 py-4 flex items-center gap-3 flex-wrap">
        <label className="font-mono text-[10px] uppercase tracking-[0.16em] text-sage" htmlFor="mp-serve-time">
          Set serve time
        </label>
        <input
          id="mp-serve-time"
          type="time"
          value={serveTime}
          onChange={(e) => setServeTime(e.target.value)}
          style={{ minHeight: 44 }}
          className="bg-bg0 border border-border px-3 py-2 font-mono text-[14px] text-ink focus:outline-none focus:border-terra"
        />
        <button
          type="button"
          onClick={commitTime}
          style={{ minHeight: 44 }}
          className="bg-terra text-bg0 text-[15px] font-medium px-5 py-3 hover:bg-terra/90 active:bg-terra/80"
        >
          Set
        </button>
      </div>
    </div>
  );
}

              src={thumb}
              alt="YouTube thumbnail"
              className="absolute inset-0 w-full h-full object-cover block"
              onError={thumbErr}
            />
            <span className="absolute bottom-2 left-2 font-mono uppercase tracking-[0.14em] text-[10px] bg-ink/80 text-cream px-2 py-1">
              {vid}
            </span>
          </>
        ) : (
          <div className="absolute inset-0 flex items-center justify-center font-mono uppercase tracking-[0.16em] text-[11px] text-warm">
            Paste a YouTube URL
          </div>
        )}
      </div>
    </div>
  );
}


// ═════════════════════════════════════════════════════════════════════════════
// 3) DependenciesEditor
//
// Repeater for pre-cook dependencies (defrost / marinate). Each row carries a
// type and an `hours_before` number. Emits the full array on every change.
//
// Props:
//   deps     — Array<{ type: "defrost" | "marinate", hours_before: number }>
//   onChange — (nextDeps) => void
// ═════════════════════════════════════════════════════════════════════════════

function DependenciesEditor({ deps, onChange }) {
  const list = deps || [];

  function update(i, patch) {
    const next = list.map((d, j) => (j === i ? Object.assign({}, d, patch) : d));
    onChange && onChange(next);
  }
  function remove(i) {
    onChange && onChange(list.filter((_, j) => j !== i));
  }
  function add() {
    onChange && onChange(list.concat([{ type: "marinate", hours_before: 2 }]));
  }

  return (
    <div>
      <div className="flex items-center justify-between mb-3">
        <label className={RF_LABEL + " mb-0"}>Dependencies</label>
        <button
          type="button"
          onClick={add}
          style={{ minHeight: 44 }}
          className="font-mono uppercase tracking-[0.16em] text-[10px] px-3 py-2 border border-border text-ink bg-cream hover:bg-bg0"
        >
          + Add
        </button>
      </div>

      {list.length === 0 && (
        <p className="font-mono uppercase tracking-[0.14em] text-[10px] text-warm/70 mb-2">
          None — nothing to defrost or marinate
        </p>
      )}

      <div className="space-y-2">
        {list.map((d, i) => (
          <div key={i} className="flex items-center gap-2">
            <select
              value={d.type}
              onChange={(e) => update(i, { type: e.target.value })}
              style={{ minHeight: 44 }}
              className={RF_INPUT + " flex-1"}
            >
              <option value="marinate">Marinate</option>
              <option value="defrost">Defrost</option>
            </select>
            <input
              type="number"
              min="0.5"
              step="0.5"
              value={d.hours_before}
              onChange={(e) => update(i, { hours_before: Number(e.target.value) })}
              style={{ minHeight: 44 }}
              className={RF_INPUT + " w-24 tabular-nums"}
            />
            <span className="font-mono uppercase tracking-[0.14em] text-[10px] text-warm whitespace-nowrap">
              hrs before
            </span>
            <button
              type="button"
              onClick={() => remove(i)}
              aria-label="Remove dependency"
              style={{ minHeight: 44, minWidth: 44 }}
              className="text-warm hover:text-terra text-xl"
            >
              ×
            </button>
          </div>
        ))}
      </div>
    </div>
  );
}


// ═════════════════════════════════════════════════════════════════════════════
// 1) RecipeForm
//
// Full-screen modal editor. Two-column on lg+, stacked on mobile. Cream
// background, hairline borders, no rounded corners except play buttons.
//
// Save flow:
//   - Validates: title required, ≥ 1 ingredient with item, ≥ 1 step with text.
//   - Coerces numerics, slugs missing IDs, drops empty rows.
//   - Calls MP.api.upsertRecipe(id, body); on success → onSave(saved).
//
// Props:
//   recipe   — existing recipe object, or null/undefined for "New recipe"
//   onSave   — (saved) => void
//   onDelete — () => void                 only fired in edit mode
//   onClose  — () => void                 always available (X + Cancel)
// ═════════════════════════════════════════════════════════════════════════════

function RecipeForm({ recipe, onSave, onDelete, onClose }) {
  const isNew = !recipe;

  // Initial form state — normalise so renders are stable.
  const [form, setForm] = React.useState(() => {
    if (recipe) {
      return Object.assign({}, recipe, {
        ingredients: (recipe.ingredients && recipe.ingredients.length)
          ? recipe.ingredients.map((i) => Object.assign({}, RF_BLANK_ING, i))
          : [Object.assign({}, RF_BLANK_ING)],
        steps: (recipe.steps && recipe.steps.length)
          ? recipe.steps.map((s) => Object.assign({}, RF_BLANK_STEP, s))
          : [Object.assign({}, RF_BLANK_STEP)],
        dependencies: recipe.dependencies || [],
        meal_type: recipe.meal_type || ["dinner"],
        tags: recipe.tags || [],
      });
    }
    return {
      id: "", name: "", name_tl: "", name_il: "",
      cuisine: "", meal_type: ["dinner"],
      tags: [],
      serves_base: 4,
      active_time_mins: 20, prep_time_mins: 15, cook_time_mins: 30,
      youtube_url: "", hero_image: "",
      ingredients: [Object.assign({}, RF_BLANK_ING)],
      steps: [Object.assign({}, RF_BLANK_STEP)],
      dependencies: [],
    };
  });

  const [lang, setLang] = React.useState("en");          // LangTabs scope
  const [busy, setBusy] = React.useState(false);
  const [err, setErr] = React.useState("");
  const [confirmDel, setConfirmDel] = React.useState(false);

  // Tags as a comma-string buffer — keeps cursor stable while typing.
  const [tagsBuffer, setTagsBuffer] = React.useState(() => (form.tags || []).join(", "));

  // ── setters ────────────────────────────────────────────────────────────────
  function setF(k, v) { setForm((f) => Object.assign({}, f, { [k]: v })); }

  function setIng(i, patch) {
    setForm((f) => {
      const next = f.ingredients.slice();
      next[i] = Object.assign({}, next[i], patch);
      return Object.assign({}, f, { ingredients: next });
    });
  }
  function addIng() {
    setForm((f) => Object.assign({}, f, { ingredients: f.ingredients.concat([Object.assign({}, RF_BLANK_ING)]) }));
  }
  function removeIng(i) {
    setForm((f) => Object.assign({}, f, { ingredients: f.ingredients.filter((_, j) => j !== i) }));
  }

  function setStep(i, patch) {
    setForm((f) => {
      const next = f.steps.slice();
      next[i] = Object.assign({}, next[i], patch);
      return Object.assign({}, f, { steps: next });
    });
  }
  function addStep() {
    setForm((f) => Object.assign({}, f, { steps: f.steps.concat([Object.assign({}, RF_BLANK_STEP)]) }));
  }
  function removeStep(i) {
    setForm((f) => Object.assign({}, f, { steps: f.steps.filter((_, j) => j !== i) }));
  }

  // ── validation + save ──────────────────────────────────────────────────────
  function validate() {
    if (!form.name || !form.name.trim()) return "Title is required.";
    const realIngs = (form.ingredients || []).filter((i) => i.item && i.item.trim());
    if (realIngs.length === 0) return "Add at least one ingredient.";
    const realSteps = (form.steps || []).filter((s) => s.instruction && s.instruction.trim());
    if (realSteps.length === 0) return "Add at least one step.";
    return "";
  }

  async function save() {
    const v = validate();
    if (v) { setErr(v); return; }
    if (!window.MP || !MP.api || typeof MP.api.upsertRecipe !== "function") {
      setErr("MP.api.upsertRecipe is not available.");
      return;
    }
    setErr(""); setBusy(true);
    try {
      const id = (form.id && form.id.trim()) || rfSlug(form.name) || ("recipe-" + Date.now());
      const tags = tagsBuffer
        .split(",")
        .map((t) => t.trim())
        .filter(Boolean);
      const payload = Object.assign({}, form, {
        id,
        tags,
        serves_base: Number(form.serves_base) || 4,
        active_time_mins: Number(form.active_time_mins) || 0,
        prep_time_mins:   Number(form.prep_time_mins)   || 0,
        cook_time_mins:   Number(form.cook_time_mins)   || 0,
        ingredients: (form.ingredients || [])
          .filter((i) => i.item && i.item.trim())
          .map((i) => Object.assign({}, i, { amount: Number(i.amount) || 0 })),
        steps: (form.steps || [])
          .filter((s) => s.instruction && s.instruction.trim())
          .map((s, idx) => Object.assign({}, s, { step: idx + 1 })),
        dependencies: (form.dependencies || []).map((d) => ({
          type: d.type,
          hours_before: Number(d.hours_before) || 0,
        })),
      });
      const saved = await MP.api.upsertRecipe(id, payload);
      onSave && onSave(saved || payload);
    } catch (e) {
      setErr((e && e.message) || "Save failed.");
    } finally {
      setBusy(false);
    }
  }

  async function del() {
    if (!form.id) { onDelete && onDelete(); return; }
    setBusy(true);
    try {
      if (window.MP && MP.api && typeof MP.api.deleteRecipe === "function") {
        await MP.api.deleteRecipe(form.id);
      }
      onDelete && onDelete();
    } catch (e) {
      setErr((e && e.message) || "Delete failed.");
      setBusy(false);
    }
  }

  // ── render helpers ─────────────────────────────────────────────────────────
  const showEN = lang === "all" || lang === "en";
  const showTL = lang === "all" || lang === "tl";
  const showIL = lang === "all" || lang === "il";

  // Stop the overlay-click handler when clicking inside the panel.
  function stop(e) { e.stopPropagation(); }

  return (
    <div
      className="fixed inset-0 z-50 bg-ink/80 flex items-stretch md:items-start justify-center overflow-y-auto"
      role="dialog"
      aria-modal="true"
      onClick={onClose}
    >
      <div
        onClick={stop}
        className="relative w-full max-w-4xl bg-cream text-ink border border-border my-0 md:my-8 mx-0 md:mx-4"
      >
        {/* ── header bar ─────────────────────────────────────────────────── */}
        <div className="sticky top-0 z-10 flex items-center justify-between gap-4 bg-cream border-b border-border px-6 md:px-9 py-4">
          <div className="min-w-0">
            <div className="font-mono uppercase tracking-[0.16em] text-[10px] text-warm mb-1">
              {isNew ? "New recipe" : "Edit recipe"}
            </div>
            <h2 className="font-display text-[24px] md:text-[28px] leading-[1.1] truncate">
              {form.name || (isNew ? "Untitled" : "Edit recipe")}
            </h2>
          </div>
          <div className="flex items-center gap-3 flex-shrink-0">
            <LangTabs active={lang} onChange={setLang} />
            <button
              type="button"
              onClick={onClose}
              aria-label="Close"
              style={{ minHeight: 44, minWidth: 44 }}
              className="border border-border text-ink hover:bg-bg0 text-2xl flex items-center justify-center"
            >
              ×
            </button>
          </div>
        </div>

        {/* ── body — two-column on lg ────────────────────────────────────── */}
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-0 lg:gap-0">
          {/* ── LEFT: metadata ─────────────────────────────────────────── */}
          <div className="p-6 md:p-9 space-y-6 lg:border-r lg:border-border">

            {/* Title block */}
            <div className="space-y-4">
              {showEN && (
                <div>
                  <label className={RF_LABEL}>Title (English) <span className="text-terra">*</span></label>
                  <input
                    value={form.name || ""}
                    onChange={(e) => {
                      setF("name", e.target.value);
                      if (isNew) setF("id", rfSlug(e.target.value));
                    }}
                    placeholder="e.g. Chicken adobo"
                    style={{ minHeight: 44 }}
                    className={RF_INPUT + " font-display text-[20px]"}
                  />
                </div>
              )}
              {showTL && (
                <div>
                  <label className={RF_LABEL}>Title — Tagalog</label>
                  <input
                    value={form.name_tl || ""}
                    onChange={(e) => setF("name_tl", e.target.value)}
                    placeholder="Pamagat sa Tagalog"
                    style={{ minHeight: 44 }}
                    className={RF_INPUT}
                  />
                </div>
              )}
              {showIL && (
                <div>
                  <label className={RF_LABEL}>Title — Ilocano</label>
                  <input
                    value={form.name_il || ""}
                    onChange={(e) => setF("name_il", e.target.value)}
                    placeholder="Pammagan iti Ilocano"
                    style={{ minHeight: 44 }}
                    className={RF_INPUT}
                  />
                </div>
              )}
            </div>

            {/* Cuisine + tags */}
            {showEN && (
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className={RF_LABEL}>Cuisine</label>
                  <input
                    value={form.cuisine || ""}
                    onChange={(e) => setF("cuisine", e.target.value)}
                    list="rf-cuisine-list"
                    placeholder="Filipino"
                    style={{ minHeight: 44 }}
                    className={RF_INPUT}
                  />
                  <datalist id="rf-cuisine-list">
                    {["Filipino","Chinese","Western","Italian","Thai","Japanese","Indian","Korean","Middle Eastern"].map((c) => (
                      <option key={c} value={c} />
                    ))}
                  </datalist>
                </div>
                <div>
                  <label className={RF_LABEL}>Tags (comma-separated)</label>
                  <input
                    value={tagsBuffer}
                    onChange={(e) => setTagsBuffer(e.target.value)}
                    placeholder="quick, family-favourite"
                    style={{ minHeight: 44 }}
                    className={RF_INPUT}
                  />
                </div>
              </div>
            )}

            {/* Meal type */}
            {showEN && (
              <div>
                <label className={RF_LABEL}>Meal type</label>
                <div className="flex flex-wrap gap-2">
                  {["breakfast", "lunch", "dinner"].map((m) => {
                    const on = (form.meal_type || []).includes(m);
                    return (
                      <button
                        key={m}
                        type="button"
                        onClick={() => setF("meal_type",
                          on
                            ? (form.meal_type || []).filter((x) => x !== m)
                            : (form.meal_type || []).concat([m])
                        )}
                        style={{ minHeight: 44 }}
                        className={`font-mono uppercase tracking-[0.16em] text-[10px] px-4 py-2 border ${on ? "bg-terra text-cream border-terra" : "bg-cream text-ink border-border hover:bg-bg0"}`}
                      >
                        {m}
                      </button>
                    );
                  })}
                </div>
              </div>
            )}

            {/* Serves + times */}
            {showEN && (
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <div>
                  <label className={RF_LABEL}>Serves base</label>
                  <input
                    type="number" min="1" max="20"
                    value={form.serves_base}
                    onChange={(e) => setF("serves_base", e.target.value)}
                    style={{ minHeight: 44 }}
                    className={RF_INPUT + " tabular-nums"}
                  />
                </div>
                <div>
                  <label className={RF_LABEL}>Active (min)</label>
                  <input
                    type="number" min="0"
                    value={form.active_time_mins}
                    onChange={(e) => setF("active_time_mins", e.target.value)}
                    style={{ minHeight: 44 }}
                    className={RF_INPUT + " tabular-nums"}
                  />
                </div>
                <div>
                  <label className={RF_LABEL}>Prep (min)</label>
                  <input
                    type="number" min="0"
                    value={form.prep_time_mins}
                    onChange={(e) => setF("prep_time_mins", e.target.value)}
                    style={{ minHeight: 44 }}
                    className={RF_INPUT + " tabular-nums"}
                  />
                </div>
                <div>
                  <label className={RF_LABEL}>Cook (min)</label>
                  <input
                    type="number" min="0"
                    value={form.cook_time_mins}
                    onChange={(e) => setF("cook_time_mins", e.target.value)}
                    style={{ minHeight: 44 }}
                    className={RF_INPUT + " tabular-nums"}
                  />
                </div>
              </div>
            )}

            {/* YouTube + hero */}
            {showEN && (
              <div className="space-y-4">
                <YoutubeFieldWithPreview
                  url={form.youtube_url || ""}
                  onChange={(v) => setF("youtube_url", v)}
                />
                <div>
                  <label className={RF_LABEL}>Hero image URL (fallback)</label>
                  <input
                    value={form.hero_image || ""}
                    onChange={(e) => setF("hero_image", e.target.value)}
                    placeholder="https://…"
                    style={{ minHeight: 44 }}
                    className={RF_INPUT}
                  />
                </div>
              </div>
            )}

            {/* Dependencies */}
            {showEN && (
              <DependenciesEditor
                deps={form.dependencies || []}
                onChange={(next) => setF("dependencies", next)}
              />
            )}
          </div>

          {/* ── RIGHT: ingredients + steps ─────────────────────────────── */}
          <div className="p-6 md:p-9 space-y-8 border-t border-border lg:border-t-0">

            {/* Ingredients */}
            <section>
              <div className="flex items-center justify-between mb-4">
                <h3 className="font-display text-[20px] leading-tight">Ingredients</h3>
                <button
                  type="button"
                  onClick={addIng}
                  style={{ minHeight: 44 }}
                  className="font-mono uppercase tracking-[0.16em] text-[10px] px-3 py-2 border border-border bg-cream text-ink hover:bg-bg0"
                >
                  + Add row
                </button>
              </div>

              <div className="space-y-3">
                {(form.ingredients || []).map((ing, i) => {
                  const fam = rfUnitFamily(ing.unit);
                  return (
                    <div key={i} className="border border-border bg-cream p-3 space-y-2">
                      {/* row 1: item + remove */}
                      <div className="flex items-start gap-2">
                        <div className="flex-1 space-y-2">
                          {showEN && (
                            <input
                              value={ing.item || ""}
                              onChange={(e) => setIng(i, { item: e.target.value })}
                              placeholder="Item — e.g. chicken thigh"
                              style={{ minHeight: 44 }}
                              className={RF_INPUT}
                            />
                          )}
                          {showTL && (
                            <input
                              value={ing.name_tl || ""}
                              onChange={(e) => setIng(i, { name_tl: e.target.value })}
                              placeholder="Tagalog"
                              style={{ minHeight: 44 }}
                              className={RF_INPUT}
                            />
                          )}
                          {showIL && (
                            <input
                              value={ing.name_il || ""}
                              onChange={(e) => setIng(i, { name_il: e.target.value })}
                              placeholder="Ilocano"
                              style={{ minHeight: 44 }}
                              className={RF_INPUT}
                            />
                          )}
                        </div>
                        <button
                          type="button"
                          onClick={() => removeIng(i)}
                          aria-label="Remove ingredient"
                          style={{ minHeight: 44, minWidth: 44 }}
                          className="text-warm hover:text-terra text-xl flex items-center justify-center"
                        >
                          ×
                        </button>
                      </div>

                      {/* row 2: amount + unit + family pill (only when EN visible) */}
                      {showEN && (
                        <div className="grid grid-cols-[1fr_1fr_auto] gap-2 items-center">
                          <input
                            type="number"
                            min="0" step="0.1"
                            value={ing.amount}
                            onChange={(e) => setIng(i, { amount: e.target.value })}
                            placeholder="Amount"
                            style={{ minHeight: 44 }}
                            className={RF_INPUT + " tabular-nums"}
                          />
                          <select
                            value={ing.unit}
                            onChange={(e) => setIng(i, { unit: e.target.value })}
                            style={{ minHeight: 44 }}
                            className={RF_INPUT}
                          >
                            {RF_UNITS.map((u) => <option key={u} value={u}>{u}</option>)}
                          </select>
                          <span className="font-mono uppercase tracking-[0.14em] text-[10px] text-warm px-2 whitespace-nowrap">
                            {fam}
                          </span>
                        </div>
                      )}

                      {/* row 3: category + source + scales */}
                      {showEN && (
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                          <select
                            value={ing.category || "produce"}
                            onChange={(e) => setIng(i, { category: e.target.value })}
                            style={{ minHeight: 44 }}
                            className={RF_INPUT}
                          >
                            {RF_CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
                          </select>
                          <select
                            value={ing.source || "wet-market"}
                            onChange={(e) => setIng(i, { source: e.target.value })}
                            style={{ minHeight: 44 }}
                            className={RF_INPUT}
                          >
                            {RF_SOURCES.map((s) => <option key={s} value={s}>{s}</option>)}
                          </select>
                          <select
                            value={ing.scales || "linear"}
                            onChange={(e) => setIng(i, { scales: e.target.value })}
                            style={{ minHeight: 44 }}
                            className={RF_INPUT}
                          >
                            {RF_SCALES.map((s) => <option key={s} value={s}>{s}</option>)}
                          </select>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </section>

            {/* Steps */}
            <section>
              <div className="flex items-center justify-between mb-4">
                <h3 className="font-display text-[20px] leading-tight">Steps</h3>
                <button
                  type="button"
                  onClick={addStep}
                  style={{ minHeight: 44 }}
                  className="font-mono uppercase tracking-[0.16em] text-[10px] px-3 py-2 border border-border bg-cream text-ink hover:bg-bg0"
                >
                  + Add step
                </button>
              </div>

              <div className="space-y-3">
                {(form.steps || []).map((s, i) => (
                  <div key={i} className="flex gap-3 border border-border bg-cream p-3">
                    <span className="font-display text-[28px] leading-none text-terra w-8 flex-shrink-0">
                      {i + 1}
                    </span>
                    <div className="flex-1 space-y-2">
                      {showEN && (
                        <textarea
                          rows={2}
                          value={s.instruction || ""}
                          onChange={(e) => setStep(i, { instruction: e.target.value })}
                          placeholder="Instruction (English)…"
                          className={RF_INPUT + " resize-y"}
                          style={{ minHeight: 44 }}
                        />
                      )}
                      {showTL && (
                        <textarea
                          rows={2}
                          value={s.instruction_tl || ""}
                          onChange={(e) => setStep(i, { instruction_tl: e.target.value })}
                          placeholder="Tagalog…"
                          className={RF_INPUT + " resize-y"}
                          style={{ minHeight: 44 }}
                        />
                      )}
                      {showIL && (
                        <textarea
                          rows={2}
                          value={s.instruction_il || ""}
                          onChange={(e) => setStep(i, { instruction_il: e.target.value })}
                          placeholder="Ilocano…"
                          className={RF_INPUT + " resize-y"}
                          style={{ minHeight: 44 }}
                        />
                      )}
                    </div>
                    <button
                      type="button"
                      onClick={() => removeStep(i)}
                      aria-label="Remove step"
                      style={{ minHeight: 44, minWidth: 44 }}
                      className="text-warm hover:text-terra text-xl flex items-start justify-center pt-1"
                    >
                      ×
                    </button>
                  </div>
                ))}
              </div>
            </section>
          </div>
        </div>

        {/* ── footer bar ─────────────────────────────────────────────────── */}
        <div className="sticky bottom-0 bg-cream border-t border-border px-6 md:px-9 py-4 flex flex-wrap items-center gap-3">
          {err && (
            <span className="font-mono uppercase tracking-[0.14em] text-[10px] text-terra mr-auto">
              {err}
            </span>
          )}

          {/* Tertiary: Cancel */}
          <button
            type="button"
            onClick={onClose}
            disabled={busy}
            style={{ minHeight: 44 }}
            className="font-mono uppercase tracking-[0.16em] text-[10px] px-4 py-2 text-terra hover:text-ink disabled:opacity-50"
          >
            Cancel
          </button>

          {/* Secondary: Delete (edit mode only) */}
          {!isNew && !confirmDel && (
            <button
              type="button"
              onClick={() => setConfirmDel(true)}
              disabled={busy}
              style={{ minHeight: 44 }}
              className="font-mono uppercase tracking-[0.16em] text-[10px] px-4 py-2 border border-ink text-ink bg-cream hover:bg-bg0 disabled:opacity-50"
            >
              Delete
            </button>
          )}
          {!isNew && confirmDel && (
            <div className="flex items-center gap-2">
              <span className="font-mono uppercase tracking-[0.14em] text-[10px] text-terra">
                Delete {form.name}?
              </span>
              <button
                type="button"
                onClick={del}
                disabled={busy}
                style={{ minHeight: 44 }}
                className="font-mono uppercase tracking-[0.16em] text-[10px] px-3 py-2 border border-terra text-terra bg-cream hover:bg-terra hover:text-cream disabled:opacity-50"
              >
                Yes, delete
              </button>
              <button
                type="button"
                onClick={() => setConfirmDel(false)}
                disabled={busy}
                style={{ minHeight: 44 }}
                className="font-mono uppercase tracking-[0.16em] text-[10px] px-3 py-2 text-warm hover:text-ink disabled:opacity-50"
              >
                Keep
              </button>
            </div>
          )}

          {/* Primary: Save */}
          <button
            type="button"
            onClick={save}
            disabled={busy || !form.name || !form.name.trim()}
            style={{ minHeight: 44 }}
            className="ml-auto bg-terra text-cream font-mono uppercase tracking-[0.16em] text-xs px-5 py-3 hover:bg-ink transition disabled:opacity-50"
          >
            {busy ? "Saving…" : isNew ? "Create recipe" : "Save changes"}
          </button>
        </div>
      </div>
    </div>
  );
}



    // ─── from v3.1-pantry-shopping.txt ─────────────────────────────────────

// ═════════════════════════════════════════════════════════════════════════════
// v3.1 — Pantry / Shopping interactivity
//
// Components:
//   1. PantryToggle          — tap-to-toggle "on hand" pills
//   2. ItemSourceMenu        — click source pill → dropdown to reassign
//   3. ExtrasEditor          — non-recipe items add/edit/remove
//   4. ShoppingByStore       — full By-Store view (replaces stub)
//   5. ShoppingByRecipe      — full By-Recipe view (replaces stub)
//   6. HktvLink              — compact deep-link to HKTVmall search
//   7. WhatsAppShareButton   — formatted text share for one source
//
// All React 18 + Babel, no imports. Top-level globals. Tailwind tokens only.
// Buttons: primary vermilion (bg-terra text-bg0); secondary (bg-cream text-ink border border-ink).
// Touch targets ≥ 44px.
// ═════════════════════════════════════════════════════════════════════════════


// ─── shared local helpers (kept here so file is self-contained) ──────────────
// In the host index.html, sourcePillMeta / formatQty / dayShort / pickRecipeThumb
// already exist — these wrappers fall through to those globals when present.
const _sourcePillMeta = (typeof sourcePillMeta === "function")
  ? sourcePillMeta
  : function (source) {
      switch (source) {
        case "wet-market": case "market":      return { label: "Wet market", cls: "bg-terra text-cream" };
        case "fusion": case "marketplace": case "supermarket":
                                                return { label: "Fusion",     cls: "bg-sand text-ink" };
        case "hktv": case "hktvmall":          return { label: "HKTVmall",   cls: "bg-bg0 text-ink" };
        case "pantry": case "on-hand":         return { label: "On hand",    cls: "bg-cream text-warm" };
        default:                                return { label: (source || "Other").toString(), cls: "bg-bg0 text-warm" };
      }
    };
const _formatQty = (typeof formatQty === "function")
  ? formatQty
  : function (amount, unit) {
      if (amount === null || amount === undefined || amount === "") return unit || "—";
      if (!unit || unit === "count" || unit === "ea") return `${amount}`;
      return `${Number(Number(amount).toFixed(2))} ${unit}`;
    };
const _dayShort = (typeof dayShort === "function")
  ? dayShort
  : function (iso) {
      const d = new Date(iso + "T00:00:00");
      return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()];
    };

// canonical source vocabulary used across these components.
// `MP.buildShoppingList` returns groups keyed by ingredient.source values seen in seed data:
// "wet-market" | "supermarket" | "hktvmall" | "other". UI labels via SOURCE_LABELS.
const SOURCE_ORDER = ["wet-market", "supermarket", "hktvmall", "other"];
const SOURCE_LABELS = {
  "wet-market": "🥬 Wet market",
  "supermarket": "🛒 Fusion / Marketplace",
  "hktvmall":   "📦 HKTVmall",
  "other":      "On hand / other",
};
const CATEGORY_LABELS = {
  meat:    "Meat & Seafood",
  produce: "Vegetables & Fruit",
  dairy:   "Dairy & Eggs",
  pantry:  "Pantry & Dry Goods",
  bakery:  "Bread & Bakery",
  frozen:  "Frozen",
  other:   "Other",
};
// stable normalize → matches MP.normalizeIngredientKey() shape for pantry lookups.
const _itemKey = (it) => ((it && it.item) || "").toLowerCase().trim();


// ═════════════════════════════════════════════════════════════════════════════
// 1) PantryToggle({ items, onToggle })
//
// Replaces the read-only "On hand" strip. Each item is a tappable pill.
// Filled vermilion when in pantry · hairline-bordered when not.
//
// Props:
//   items    — array of { item: string, inPantry: boolean }  (item = normalized key)
//   onToggle — (itemKey, nextInPantry) => void
// ═════════════════════════════════════════════════════════════════════════════
function PantryToggle({ items, onToggle }) {
  if (!items || !items.length) return null;
  return (
    <div className="border-x border-b border-border bg-bg0 px-9 py-6">
      <div className="font-mono uppercase tracking-[0.16em] text-[10px] text-terra mb-3">
        On hand · tap to toggle
      </div>
      <div className="flex flex-wrap gap-2">
        {items.map((it) => {
          const k = _itemKey(it);
          const on = !!it.inPantry;
          return (
            <button
              key={k}

                on
                  ? "bg-terra text-bg0 border border-terra hover:bg-terra/90"
                  : "bg-cream text-ink border border-ink/40 hover:border-ink"
              }`}
              aria-pressed={on}
            >
              {on ? "✓ " : ""}{it.item}

}


// ═════════════════════════════════════════════════════════════════════════════
// 2) ItemSourceMenu({ item, currentSource, onChange })
//
// Click on the source pill opens a 4-option dropdown.
// Pick → onChange(newSource) → caller wires to MP.api.setSource(item, source).
//
// Props:
//   item          — string  raw ingredient name (passed to MP.api.setSource)
//   currentSource — string  current canonical source key
//   onChange      — (newSource) => void
// ═════════════════════════════════════════════════════════════════════════════
function ItemSourceMenu({ item, currentSource, onChange }) {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);

  // close on outside click / esc — keeps the menu local without a portal.
  React.useEffect(() => {
    if (!open) return;
    function onDoc(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    function onKey(e) { if (e.key === "Escape") setOpen(false); }
    document.addEventListener("mousedown", onDoc);
    document.addEventListener("keydown", onKey);
    return () => {
      document.removeEventListener("mousedown", onDoc);
      document.removeEventListener("keydown", onKey);
    };
  }, [open]);

  const meta = _sourcePillMeta(currentSource);

  return (
    <div ref={ref} className="relative inline-block">
      <button
        type="button"
        onClick={() => setOpen((v) => !v)}
        style={{ minHeight: 44 }}
        className={`font-mono uppercase tracking-[0.14em] text-[10px] px-2.5 py-2 hover:opacity-80 ${meta.cls}`}
        aria-haspopup="menu"
        aria-expanded={open}
        title={`Change source for ${item}`}
      >
        {meta.label} ▾
      </button>
      {open && (
        <div
          role="menu"
          className="absolute right-0 z-30 mt-1 min-w-[180px] bg-cream border border-ink shadow-lg"
        >
          {SOURCE_ORDER.map((src) => {
            const active = src === currentSource;
            return (
              <button
                key={src}
                role="menuitem"
                type="button"
                onClick={() => { setOpen(false); onChange && onChange(src); }}
                style={{ minHeight: 44 }}
                className={`w-full text-left px-4 py-2 text-[13px] block border-b border-border last:border-b-0 ${
                  active ? "bg-terra text-bg0" : "bg-cream text-ink hover:bg-bg0"
                }`}
              >
                {SOURCE_LABELS[src]}
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}


// ═════════════════════════════════════════════════════════════════════════════
// 3) ExtrasEditor({ extras, onAdd, onUpdate, onRemove })

//   onUpdate — (id, patch) => void

function ExtrasEditor({ extras, onAdd, onUpdate, onRemove }) {

      {/* add form */}
      <form onSubmit={submit} className="flex flex-wrap gap-3 items-stretch">

// ═════════════════════════════════════════════════════════════════════════════
// 7) WhatsAppShareButton({ shoppingList, source })
//
// Builds a formatted text for one source group and opens whatsapp://send.
// shoppingList = the groups[source] subtree from MP.buildShoppingList → { [category]: [{item, amount, unit}] }
// ═════════════════════════════════════════════════════════════════════════════
function WhatsAppShareButton({ shoppingList, source, weekStart }) {
  function build() {
    const lines = [];
    lines.push(`Shopping list — ${SOURCE_LABELS[source] || source}`);
    if (weekStart) {
      const d = new Date(weekStart + "T00:00:00");
      const dd = d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
      lines.push(dd);
    }
    lines.push("");
    const catEmoji = { meat: "🥩", produce: "🥬", dairy: "🥚", pantry: "🌾", bakery: "🥖", frozen: "❄️", other: "📦" };
    for (const [cat, items] of Object.entries(shoppingList || {})) {
      if (!items || !items.length) continue;
      lines.push(`${catEmoji[cat] || "•"} ${CATEGORY_LABELS[cat] || cat}:`);
      for (const it of items) {
        const qty = _formatQty(it.amount, it.unit);
        lines.push(`- ${it.item} · ${qty}`);
      }
      lines.push("");
    }
    return lines.join("\n").trim();
  }

  function share() {
    const text = build();
    const url = `whatsapp://send?text=${encodeURIComponent(text)}`;
    // some desktops need wa.me as a fallback — try whatsapp:// first via window.open.
    const w = window.open(url, "_blank");
    if (!w) window.location.href = `https://wa.me/?text=${encodeURIComponent(text)}`;
  }

  return (
    <button
      type="button"
      onClick={share}
      style={{ minHeight: 44 }}
      className="bg-cream text-ink border border-ink text-[13px] font-medium px-4 py-2 hover:bg-bg0 active:bg-sand"
      title="Share via WhatsApp"
    >
      📱 WhatsApp
    </button>
  );
}


// ═════════════════════════════════════════════════════════════════════════════
// 4) ShoppingByStore({ recipes, plan, weekStart, sources, extras, pantry,
//                     onTogglePantry, onChangeSource })
//
// Full implementation of the By-Store view. Replaces the stub.
//
// Props:
//   recipes        — full library
//   plan           — weekplan (passed to MP.buildShoppingList)
//   weekStart      — ISO date for share/print headers
//   sources        — { [itemKey]: source } overrides (passed to buildShoppingList)
//   extras         — array of { id, item, source, done? }
//   pantry         — { [itemKey]: true } for already-on-hand items
//   onTogglePantry — (itemKey, have) => void   →  MP.api.togglePantry
//   onChangeSource — (item, source) => void    →  MP.api.setSource
// ═════════════════════════════════════════════════════════════════════════════
function ShoppingByStore({
  recipes, plan, weekStart, sources, extras, pantry,
  onTogglePantry, onChangeSource,
}) {
  const [search, setSearch] = React.useState("");

  // Compute groups from buildShoppingList (defensive — empty if MP missing).
  const groups = React.useMemo(() => {
    if (!window.MP || typeof MP.buildShoppingList !== "function") return {};
    return MP.buildShoppingList(recipes || [], plan || { days: [] }, sources || {});
  }, [recipes, plan, sources]);

  // Fold extras into the groups, by their source. Extras are special — they
  // have no qty, no category beyond "other", and aren't in `pantry`.
  const groupsWithExtras = React.useMemo(() => {
    const out = {};
    for (const src of SOURCE_ORDER) {
      out[src] = {};
      const fromGroups = groups[src] || {};
      for (const [cat, items] of Object.entries(fromGroups)) {
        out[src][cat] = items.slice();
      }
    }
    for (const x of (extras || [])) {
      if (x.done) continue;
      const src = SOURCE_ORDER.includes(x.source) ? x.source : "other";
      out[src].other = out[src].other || [];
      out[src].other.push({ item: x.item, amount: "", unit: "", _extra: true, _id: x.id });
    }
    return out;
  }, [groups, extras]);

  function rowsMatch(items) {
    if (!search.trim()) return items;
    const q = search.toLowerCase();
    return items.filter((it) => (it.item || "").toLowerCase().includes(q));
  }

  function printList() {
    if (typeof window.print === "function") window.print();
  }

  // empty state
  const totalItems = SOURCE_ORDER.reduce(
    (s, src) => s + Object.values(groupsWithExtras[src] || {}).reduce((a, b) => a + b.length, 0),
    0
  );
  if (totalItems === 0) {
    return (
      <div className="border-x border-b border-border p-9 text-center">
        <div className="font-mono uppercase tracking-[0.16em] text-[10px] text-warm mb-2">By store</div>
        <p className="font-display text-warm">Nothing to shop yet — add meals to the week.</p>
      </div>
    );
  }

  return (
    <div className="border-x border-b border-border bg-cream">
      {/* search bar */}
      <div className="px-9 py-5 border-b border-border bg-bg0">
        <input
          value={search}
          onChange={(e) => setSearch(e.target.value)}
          placeholder="Filter items…"
          style={{ minHeight: 44 }}
          className="w-full max-w-md bg-cream border border-ink/40 px-4 py-2 text-[15px] focus:outline-none focus:border-ink"
        />
      </div>

      {SOURCE_ORDER.map((src) => {
        const cats = groupsWithExtras[src] || {};
        const itemCount = Object.values(cats).reduce((s, arr) => s + arr.length, 0);
        if (!itemCount) return null;

        return (
          <section key={src} className="border-b border-border last:border-b-0">
            {/* source header */}
            <div className="flex items-center justify-between flex-wrap gap-3 px-9 py-5 bg-cream">
              <div>
                <div className="font-mono uppercase tracking-[0.16em] text-[10px] text-warm mb-1">
                  {itemCount} item{itemCount === 1 ? "" : "s"}
                </div>
                <h3 className="font-display text-[28px] leading-[1.1]">
                  {SOURCE_LABELS[src]}
                </h3>
              </div>
              <div className="flex gap-2">
                <WhatsAppShareButton shoppingList={cats} source={src} weekStart={weekStart} />
                <button
                  type="button"
                  onClick={printList}
                  style={{ minHeight: 44 }}
                  className="bg-cream text-ink border border-ink text-[13px] font-medium px-4 py-2 hover:bg-bg0 active:bg-sand"
                >
                  🖨 Print
                </button>
              </div>
            </div>

            {/* category sub-groups */}
            {Object.keys(CATEGORY_LABELS).concat(Object.keys(cats).filter((c) => !CATEGORY_LABELS[c])).map((cat) => {
              const items = cats[cat];
              if (!items || !items.length) return null;
              const filtered = rowsMatch(items);
              if (!filtered.length) return null;
              return (
                <div key={cat} className="border-t border-border px-9 py-4">
                  <div className="font-mono uppercase tracking-[0.16em] text-[10px] text-warm mb-3">
                    {CATEGORY_LABELS[cat] || cat}
                  </div>
                  <ul>
                    {filtered.map((it, i) => {
                      const k = _itemKey(it);
                      const has = !!(pantry && pantry[k]);
                      return (
                        <li
                          key={(it._id || "") + "|" + k + "|" + i}
                          className="grid grid-cols-[20px_1fr_auto_auto_auto] items-center gap-3 py-2 border-b border-border/60 last:border-b-0"
                        >
                          {/* tap-to-mark-bought */}
                          <input
                            type="checkbox"
                            checked={has}
                            onChange={(e) => onTogglePantry && onTogglePantry(k, e.target.checked)}
                            className="w-5 h-5 accent-terra cursor-pointer"
                            aria-label={`Mark ${it.item} on hand`}
                          />
                          <span className={`font-display text-[15px] ${has ? "line-through text-warm" : "text-ink"}`}>
                            {it.item}{it._extra ? <span className="ml-2 text-[10px] uppercase tracking-[0.14em] text-warm">extra</span> : null}
                          </span>
                          <span className="font-mono text-[12px] text-warm tabular-nums min-w-[4rem] text-right">
                            {_formatQty(it.amount, it.unit)}
                          </span>
                          {/* HKTVmall deep-link only when source is hktvmall (most useful there) */}
                          {src === "hktvmall" ? <HktvLink keyword={it.item} /> : <span />}
                          {/* source override */}
                          <ItemSourceMenu
                            item={it.item}
                            currentSource={src}
                            onChange={(newSrc) => onChangeSource && onChangeSource(it.item, newSrc)}
                          />
                        </li>
                      );
                    })}
                  </ul>
                </div>
              );
            })}
          </section>
        );
      })}
    </div>
  );
}


// ═════════════════════════════════════════════════════════════════════════════
// 5) ShoppingByRecipe({ recipes, plan, weekStart, onPlay })
//
// One card per recipe in the plan. Hero photo + name + meal/day eyebrow +
// ingredient list (item · qty · source pill).
// ═════════════════════════════════════════════════════════════════════════════
function ShoppingByRecipe({ recipes, plan, weekStart, onPlay }) {
  const recipeMap = React.useMemo(() => {
    const m = {};
    (recipes || []).forEach((r) => { m[r.id] = r; });
    return m;
  }, [recipes]);

  // Each entry = a (date, mealType, recipe) tuple. A recipe used twice in a
  // week shows up twice — visually intentional, since the qty is per-meal.
  const entries = React.useMemo(() => {
    const out = [];
    if (!plan || !plan.days) return out;
    for (const day of plan.days) {
      for (const mealType of ["breakfast", "lunch", "dinner"]) {
        const ids = (window.MP && MP.getMealRecipeIds) ? MP.getMealRecipeIds(day, mealType) : [];
        for (const id of ids) {
          const r = recipeMap[id];
          if (!r) continue;
          out.push({
            key: `${day.date}-${mealType}-${id}`,
            date: day.date,
            mealType,
            recipe: r,
            serves: day[mealType + "_serves"] || plan.serves || 4,
          });

    return out;
  }, [plan, recipeMap]);

  if (!entries.length) {
    return (
      <div className="border-x border-b border-border p-9 text-center">
        <div className="font-mono uppercase tracking-[0.16em] text-[10px] text-warm mb-2">By recipe</div>

  return (
    <div className="border-x border-b border-border">
      {entries.map((e, ci) => {
        const r = e.recipe;
        const eyebrow = `${_dayShort(e.date)} ${e.mealType} · serves ${e.serves}`;
        const thumb = (typeof pickRecipeThumb === "function")
          ? pickRecipeThumb(r, ci)
          : (r.thumbnail || "https://images.unsplash.com/photo-1495521821757-a1efb6729352?w=600&q=80");
        return (
          <div key={e.key} className="grid grid-cols-1 md:grid-cols-[280px_1fr] border-b border-border last:border-b-0">
            {/* photo */}
            <div className="relative bg-bg0 min-h-[200px] md:min-h-[260px]">
              <img
                src={thumb}
                alt={r.name}
                className="w-full h-full object-cover block absolute inset-0"
              />
              {onPlay && r.youtube_url && (
                <button
                  onClick={() => onPlay(r)}
                  aria-label={`Play ${r.name}`}
                  style={{ minHeight: 44, minWidth: 44 }}
                  className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-14 h-14 rounded-full bg-cream/95 text-ink flex items-center justify-center hover:bg-terra hover:text-cream transition"
                >
                  <span
                    className="ml-1"
                    style={{
                      borderTop: "8px solid transparent",
                      borderBottom: "8px solid transparent",
                      borderLeft: "12px solid currentColor",
                      width: 0, height: 0, display: "inline-block",
                    }}
                  />
                </button>
              )}
            </div>

            {/* body */}
            <div className="p-7">
              <div className="font-mono uppercase tracking-[0.16em] text-[11px] text-ink mb-2">
                {eyebrow}
              </div>
              <h3 className="font-display text-[24px] leading-[1.1] mb-5">{r.name}</h3>

              <ul>
                {(r.ingredients || []).map((ing, i) => {
                  const meta = _sourcePillMeta(ing.source);
                  return (
                    <li
                      key={i}
                      className="grid grid-cols-[1fr_auto_auto_auto] items-center gap-3 py-2 border-b border-border/60 last:border-b-0"
                    >
                      <span className="font-display text-[14px] text-ink">{ing.item}</span>
                      <span className="font-mono text-[11px] text-warm tabular-nums min-w-[3rem] text-right">
                        {_formatQty(ing.amount, ing.unit)}
                      </span>
                      <span className={`font-mono uppercase tracking-[0.14em] text-[9px] px-2 py-0.5 ${meta.cls}`}>
                        {meta.label}
                      </span>
                      {ing.source === "hktvmall" ? <HktvLink keyword={ing.item} /> : <span />}
                    </li>
                  );
                })}
              </ul>
            </div>
          </div>
        );
      })}
    </div>
  );
}
