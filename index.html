<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#F4F1EC" />
  <title>Meal Planner</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23F4F1EC'/%3E%3Cpolygon points='24,16 24,48 50,32' fill='%23C8392B'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: "#F4F1EC", sand: "#EAE3D9", ink: "#1A1A1A",
            terra: "#C8392B", sage: "#6B6B6B", warm: "#6B6B6B",
            bg0: "#FAFAF7", border: "#E4DDD5",
            bark: "#2C1F17", "accent-soft": "#F2DDD9",
          },
          fontFamily: {
            display: ["Source Serif 4", "Georgia", "serif"],
            body: ["Inter", "system-ui", "sans-serif"],
            mono: ["JetBrains Mono", "ui-monospace", "monospace"],
          },
        },
      },
    };
  </script>
  <style>
    html, body { background: #F4F1EC; color: #1A1A1A; font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    h1, h2, h3, h4 { font-family: "Source Serif 4", Georgia, serif; font-weight: 400; letter-spacing: -0.005em; }
    .num { font-variant-numeric: tabular-nums; }
    /* No border-radius anywhere except small dot/circle UI (rounded-full) */
    [class*="rounded-"]:not([class*="rounded-full"]) { border-radius: 0 !important; }

    @keyframes mp-pulse {
      0%, 100% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 rgba(200,57,43,0.55); }
      50% { transform: scale(1.18); opacity: 0.85; box-shadow: 0 0 0 8px rgba(200,57,43,0); }
    }
    @keyframes mp-kenburns {
      0% { transform: scale(1) translate(0,0); }
      100% { transform: scale(1.08) translate(-1.5%, 1%); }
    }
    .animate-mp-pulse { animation: mp-pulse 1800ms ease-in-out infinite; }
    .animate-mp-kenburns { animation: mp-kenburns 18s ease-in-out infinite alternate; }

    /* Print styles — Today / Recipe / Week */
    @media print {
      body, html { background: white !important; color: #1A1A1A !important; }
      .no-print, nav, .work-head-actions, .lang-toggle, .play-btn, .role-pill, .pulse,
      .now-tag, .top-right, [class*="bg-bark"], [class*="bg-ink"] { display: none !important; }
      .today-hero, .tonight-hero { height: auto !important; min-height: 0 !important; background: white !important; color: #1A1A1A !important; }
      .today-hero .photo, .tonight-hero .photo, .gradient { display: none !important; }
      .today-hero .text, .tonight-hero .text { position: static !important; color: #1A1A1A !important; padding: 0 !important; }
      .today-hero .text h2, .tonight-hero .text h2 { font-size: 28pt !important; color: #1A1A1A !important; }
      [class*="bg-terra"] { background: white !important; color: #C8392B !important; border: 1px solid #C8392B !important; }
      [class*="text-bg0"], [class*="text-cream"] { color: #1A1A1A !important; }
      .timeline { display: block !important; padding: 0 !important; }
      .tl-rail { display: none !important; }
      .tl-events { padding: 0 !important; }
      .tl-event { break-inside: avoid; page-break-inside: avoid; }
      img { max-width: 280px !important; }
    }
  </style>
  <script src="shared.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    const APP_VERSION = "v3.0 · 2026-05-08";

    // Bridge so component code can call getMealRecipes() at top-level:
    function getMealRecipes(mealValue) { return MP.getMealRecipes(mealValue); }

    // ════════════════════════════════════════════════════════
    // SHELL: Onboarding, AppShell, SettingsView (agent A output)
    // ════════════════════════════════════════════════════════
// Onboarding({ onContinue })
// Full-bleed two-column welcome screen.
// Left: editorial headline + lede + 3 numbered promises + CTA + skip link.
// Right: hero kitchen photo with bottom-overlay editorial pull-quote.
// Props:
//   - onContinue: () => void  — called by primary CTA AND the skip link
function Onboarding({ onContinue }) {
  const promises = [
    { num: '01', text: 'Build your week from the recipe library — videos auto-pulled.' },
    { num: '02', text: "Shopping list, today's cooking timeline, and overnight prep — all generated for you." },
    { num: '03', text: 'Share with anyone helping in your kitchen — or print it for the wall.' },
  ];

  return (
    <div className="min-h-screen bg-bg0 grid grid-cols-1 lg:grid-cols-2">
      {/* LEFT — words */}
      <div className="flex flex-col px-6 py-10 lg:px-14 lg:py-20 order-2 lg:order-1">
        <div className="font-mono uppercase tracking-[0.16em] text-[11px] text-sage">
          Welcome
        </div>

        <h1 className="font-display font-normal text-[44px] leading-[1.02] tracking-[-0.015em] text-ink mt-6 lg:text-[64px]">
          Plan the week.<br />Cook with <em className="italic text-terra">ease.</em>
        </h1>

        <p className="font-display text-[17px] leading-[1.5] text-warm mt-6 max-w-[480px]">
          Editorial photography. Videos as your instructions. A shopping list that knows what each ingredient is for. Built for kitchens, not for spreadsheets.
        </p>

        <div className="mt-14 pt-8 border-t border-border flex flex-col gap-6 max-w-[480px]">
          {promises.map((p) => (
            <div key={p.num} className="grid grid-cols-[32px_1fr] gap-4 items-start">
              <span className="font-mono uppercase tracking-[0.16em] text-[11px] text-terra pt-1">
                {p.num}
              </span>
              <div className="font-display text-[18px] leading-[1.3] text-ink">
                {p.text}
              </div>
            </div>
          ))}
        </div>

        <div className="mt-auto pt-12 flex items-center justify-between gap-6 flex-wrap">
          <a
            href="#"
            onClick={(e) => { e.preventDefault(); onContinue && onContinue(); }}
            className="font-mono uppercase tracking-[0.16em] text-[11px] text-sage border-b border-border pb-[2px]"
          >
            Skip — set up later
          </a>
          <button
            type="button"
            onClick={() => onContinue && onContinue()}
            className="bg-terra text-bg0 px-6 py-[14px] font-mono uppercase tracking-[0.16em] text-[11px] hover:opacity-90"
          >
            Start planning your week →
          </button>
        </div>
      </div>

      {/* RIGHT — photo with overlay quote */}
      <div className="relative min-h-[320px] lg:min-h-screen overflow-hidden order-1 lg:order-2 border-l border-border">
        <img
          src="https://images.unsplash.com/photo-1556910103-1c02745aae4d?w=900&q=80&auto=format&fit=crop"
          alt="Warm kitchen scene"
          className="absolute inset-0 w-full h-full object-cover"
        />
        <div className="absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-transparent" />
        <div className="absolute left-6 right-6 bottom-6 lg:left-12 lg:right-12 lg:bottom-12 text-cream">
          <div className="font-mono uppercase tracking-[0.16em] text-[10px] text-cream/70">
            From the kitchen
          </div>
          <blockquote className="font-display italic text-[20px] lg:text-[26px] leading-[1.25] mt-3 text-cream max-w-[520px]">
            “The video is the recipe. Watch it once at the start, again when you need it, and trust your hands.”
          </blockquote>
          <cite className="not-italic font-mono uppercase tracking-[0.16em] text-[10px] text-cream/70 mt-3 inline-block">
            House rule
          </cite>
        </div>
      </div>
    </div>
  );
}

// AppShell({ activeView, onNavigate, header, children })
// Persistent chrome: 220px left rail on desktop, bottom tab-bar on mobile.
// Rail shows wordmark, week eyebrow, 5 numbered nav tabs (active = vermilion border-bottom + text-terra),
// and a role-pill at the bottom.
// `header` renders above `children` as the work-head strip on the content side.
// Props:
//   - activeView: string  — one of 'week' | 'today' | 'pantry' | 'recipes' | 'settings'
//   - onNavigate: (view: string) => void
//   - header: ReactNode  — work-head strip (eyebrow + h1 left, action buttons right)
//   - children: ReactNode  — main content area
function AppShell({ activeView, onNavigate, header, children }) {
  const tabs = [
    { id: 'week',     label: 'Week',     num: '01' },
    { id: 'today',    label: 'Today',    num: '02' },
    { id: 'pantry',   label: 'Pantry',   num: '03' },
    { id: 'recipes',  label: 'Recipes',  num: '04' },
    { id: 'settings', label: 'Settings', num: '05' },
  ];

  const handleNav = (e, id) => {
    e.preventDefault();
    onNavigate && onNavigate(id);
  };

  return (
    <div className="min-h-screen bg-bg0 text-ink flex">
      {/* LEFT RAIL — desktop only */}
      <aside
        className="hidden lg:flex flex-col border-r border-border bg-cream px-[22px] py-7 shrink-0"
        style={{ width: '220px' }}
      >
        <div className="font-display font-normal text-[22px] leading-none tracking-[-0.005em] mb-1">
          Meal <em className="italic text-terra not-italic-fix" style={{ fontStyle: 'italic' }}>Planner</em>
        </div>
        <div className="font-mono uppercase tracking-[0.16em] text-[10px] text-sage mt-1">
          Wk 19 · 11–17 May
        </div>

        <nav className="mt-10 flex flex-col">
          {tabs.map((t) => {
            const active = activeView === t.id;
            return (
              <a
                key={t.id}
                href="#"
                onClick={(e) => handleNav(e, t.id)}
                className={
                  'flex items-center justify-between py-[10px] border-b ' +
                  (active
                    ? 'border-terra text-terra font-medium'
                    : 'border-border text-ink hover:text-terra')
                }
              >
                <span>{t.label}</span>
                <span
                  className={
                    'font-mono uppercase tracking-[0.1em] text-[10px] ' +
                    (active ? 'text-terra' : 'text-sage')
                  }
                >
                  {t.num}
                </span>
              </a>
            );
          })}
        </nav>

        <div className="mt-auto pt-5 border-t border-border">
          <span className="inline-flex items-center font-mono uppercase tracking-[0.14em] text-[10px] text-warm">
            <span className="inline-block w-[6px] h-[6px] bg-terra rounded-full mr-[6px]" />
            2 people · Faith + Leni
          </span>
        </div>
      </aside>

      {/* MAIN COLUMN */}
      <main className="flex-1 min-w-0 flex flex-col pb-[64px] lg:pb-0">
        {header && (
          <div className="border-b border-border px-6 py-6 lg:px-10 lg:py-8 flex items-start justify-between gap-6 flex-wrap">
            {header}
          </div>
        )}
        <div className="flex-1 min-w-0">
          {children}
        </div>
      </main>

      {/* BOTTOM TAB BAR — mobile only */}
      <nav className="lg:hidden fixed bottom-0 left-0 right-0 bg-cream border-t border-border flex z-50">
        {tabs.map((t) => {
          const active = activeView === t.id;
          return (
            <a
              key={t.id}
              href="#"
              onClick={(e) => handleNav(e, t.id)}
              className={
                'flex-1 flex flex-col items-center justify-center py-2 border-r border-border last:border-r-0 ' +
                (active ? 'text-terra' : 'text-ink')
              }
              style={active ? { borderTop: '2px solid #C8392B', marginTop: '-1px' } : {}}
            >
              <span
                className={
                  'font-mono uppercase tracking-[0.14em] text-[9px] mb-1 ' +
                  (active ? 'text-terra' : 'text-sage')
                }
              >
                {t.num}
              </span>
              <span className="text-[12px] leading-none" style={{ fontFamily: 'Inter, sans-serif' }}>
                {t.label}
              </span>
            </a>
          );
        })}
      </nav>
    </div>
  );
}

// SettingsView({ members, onInvite, onRevoke, onCopyMagicLink })
// Section 04 layout. Two columns on desktop, stacks on mobile.
// Left: members list + permission table.
// Right: invite form (email + 3 radio cards, Cook only pre-selected) + magic link block.
// Props:
//   - members: Array<{ name, email, perm: 'owner' | 'plan' | 'cook' | 'view', initial }>
//     defaults to Faith (owner) + Leni (cook).
//   - onInvite: ({ email, perm }) => void
//   - onRevoke: (member) => void
//   - onCopyMagicLink: ({ perm, url }) => void
function SettingsView({ members, onInvite, onRevoke, onCopyMagicLink }) {
  const defaultMembers = [
    { name: 'Faith Lantz', email: 'faith@lantz.com', perm: 'owner', initial: 'F' },
    { name: 'Leni', email: 'leni@whatsapp · magic link', perm: 'cook', initial: 'L' },
  ];
  const list = members && members.length ? members : defaultMembers;

  const [email, setEmail] = useState('');
  const [invitePerm, setInvitePerm] = useState('cook');
  const [linkPerm, setLinkPerm] = useState('cook');

  const magicUrl = 'mealplanner.app/lantz/wk19/leni-cook-9k4xq';
  const tokenSpan = 'leni-cook-9k4xq';
  const baseUrl = 'mealplanner.app/lantz/wk19/';

  const permLabel = (p) => {
    if (p === 'owner') return 'Owner';
    if (p === 'plan')  return 'Plan + cook';
    if (p === 'cook')  return 'Cook only';
    return 'View only';
  };

  const permPillClass = (p) => {
    if (p === 'owner') return 'bg-ink text-bg0 border-ink';
    if (p === 'plan' || p === 'cook') return 'border-terra text-terra';
    return 'border-border text-warm';
  };

  const inviteOptions = [
    { id: 'plan', title: 'Plan + cook', sub: 'For a partner or co-planner' },
    { id: 'cook', title: 'Cook only',   sub: 'For a helper, family member, or guest cook' },
    { id: 'view', title: 'View only',   sub: "For someone who just wants to see what you're cooking" },
  ];

  const handleSendInvite = () => {
    onInvite && onInvite({ email, perm: invitePerm });
  };

  const handleCopy = () => {
    onCopyMagicLink && onCopyMagicLink({ perm: linkPerm, url: magicUrl });
  };

  return (
    <div className="grid grid-cols-1 lg:grid-cols-2">
      {/* LEFT — members + permission table */}
      <div className="px-6 py-9 lg:px-10 lg:py-9 border-b lg:border-b-0 lg:border-r border-border">
        <div className="font-mono uppercase tracking-[0.16em] text-[11px] text-sage mb-4">
          Who has access · {list.length} {list.length === 1 ? 'person' : 'people'}
        </div>

        <div className="flex flex-col">
          {list.map((m, idx) => (
            <div
              key={(m.email || m.name) + idx}
              className="grid grid-cols-[44px_1fr_auto_auto] gap-4 items-center py-4 border-b border-border"
            >
              <div className="w-[44px] h-[44px] bg-sand text-ink font-display text-[20px] flex items-center justify-center">
                {m.initial || (m.name ? m.name[0] : '·')}
              </div>
              <div className="min-w-0">
                <div className="font-display text-[17px] leading-[1.2] text-ink truncate">{m.name}</div>
                <div className="font-mono uppercase tracking-[0.14em] text-[10px] text-warm mt-1 truncate">
                  {m.email}
                </div>
              </div>
              <div
                className={
                  'font-mono uppercase tracking-[0.14em] text-[10px] px-2 py-1 border ' +
                  permPillClass(m.perm)
                }
              >
                {permLabel(m.perm)}
              </div>
              {m.perm !== 'owner' ? (
                <button
                  type="button"
                  onClick={() => onRevoke && onRevoke(m)}
                  aria-label={`Remove ${m.name}`}
                  title="Remove"
                  className="w-11 h-11 flex items-center justify-center text-sage hover:text-terra border border-border"
                >
                  ×
                </button>
              ) : (
                <span className="w-8 h-8" />
              )}
            </div>
          ))}
        </div>

        <div className="border-t border-border mt-8" />

        <div className="font-mono uppercase tracking-[0.16em] text-[11px] text-sage mt-6 mb-4">
          What each level can do
        </div>

        <div className="flex flex-col">
          {[
            { id: 'owner', title: 'Owner',       desc: 'Plan the week · cook · invite others · billing' },
            { id: 'plan',  title: 'Plan + cook', desc: 'Edit the plan · cook · view shopping. Cannot invite or remove.' },
            { id: 'cook',  title: 'Cook only',   desc: 'View today, watch videos, mark cooked. Cannot edit the plan.' },
            { id: 'view',  title: 'View only',   desc: 'See the week and recipes. No editing, no marking.' },
          ].map((row, i, arr) => (
            <div
              key={row.id}
              className={
                'grid grid-cols-1 lg:grid-cols-[120px_1fr] gap-2 lg:gap-4 py-3 ' +
                (i < arr.length - 1 ? 'border-b border-border' : '')
              }
            >
              <div
                className={
                  'font-mono uppercase tracking-[0.14em] text-[10px] px-2 py-1 border w-fit ' +
                  permPillClass(row.id)
                }
              >
                {row.title}
              </div>
              <div className="font-display text-[14px] leading-[1.45] text-warm">
                {row.desc}
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* RIGHT — invite form + magic link */}
      <div className="px-6 py-9 lg:px-10 lg:py-9">
        <div className="font-mono uppercase tracking-[0.16em] text-[11px] text-sage mb-4">
          Invite someone
        </div>

        <div className="flex flex-col gap-4">
          <input
            type="email"
            placeholder="email or phone number"
            value={email}
            onChange={(e) => setEmail(e.target.value)}
            className="w-full bg-bg0 border border-border px-4 py-[14px] font-display text-[16px] text-ink placeholder:italic placeholder:text-sage focus:outline-none focus:border-terra"
          />

          <div className="flex flex-col border border-border">
            {inviteOptions.map((opt, i, arr) => {
              const selected = invitePerm === opt.id;
              return (
                <label
                  key={opt.id}
                  className={
                    'grid grid-cols-[24px_1fr] gap-3 items-start px-4 py-4 cursor-pointer ' +
                    (i < arr.length - 1 ? 'border-b border-border ' : '') +
                    (selected ? 'bg-bg0' : '')
                  }
                  style={selected ? { borderLeft: '3px solid #C8392B', paddingLeft: '13px' } : {}}
                >
                  <input
                    type="radio"
                    name="invite-perm"
                    checked={selected}
                    onChange={() => setInvitePerm(opt.id)}
                    className="mt-1 w-4 h-4 accent-terra"
                  />
                  <div>
                    <div className="font-display text-[16px] leading-[1.2] text-ink">{opt.title}</div>
                    <div className="font-mono uppercase tracking-[0.14em] text-[10px] text-sage mt-1">
                      {opt.sub}
                    </div>
                  </div>
                </label>
              );
            })}
          </div>

          <button
            type="button"
            onClick={handleSendInvite}
            className="self-start bg-terra text-bg0 px-6 py-[14px] font-mono uppercase tracking-[0.16em] text-[11px] hover:opacity-90"
          >
            Send invite →
          </button>
        </div>

        <div className="border-t border-border my-8" />

        <div className="font-mono uppercase tracking-[0.16em] text-[11px] text-sage mb-3">
          Or share a magic link
        </div>
        <p className="font-display text-[14px] leading-[1.5] text-warm mb-4 max-w-[480px]">
          No account needed. The link opens this week's plan in their browser. They can mark recipes cooked but can't edit.
        </p>

        <div className="flex flex-col gap-4 border border-border p-4">
          <div className="flex flex-col gap-[6px]">
            <span className="font-mono uppercase tracking-[0.16em] text-[10px] text-sage">
              Permission
            </span>
            <select
              value={linkPerm}
              onChange={(e) => setLinkPerm(e.target.value)}
              className="bg-bg0 border border-border px-3 py-[10px] font-display text-[14px] text-ink focus:outline-none focus:border-terra"
            >
              <option value="cook">Cook only (recommended)</option>
              <option value="view">View only</option>
            </select>
          </div>

          <div className="bg-bg0 border border-border px-3 py-[10px] font-mono text-[12px] text-ink overflow-x-auto whitespace-nowrap">
            <code>
              {baseUrl}
              <span className="text-terra font-semibold">{tokenSpan}</span>
            </code>
          </div>

          <div className="flex flex-col sm:flex-row gap-3">
            <button
              type="button"
              onClick={handleCopy}
              className="flex-1 bg-transparent text-ink border border-ink px-6 py-[14px] font-mono uppercase tracking-[0.16em] text-[11px] hover:bg-ink hover:text-bg0"
            >
              Copy link
            </button>
            <button
              type="button"
              onClick={handleCopy}
              className="flex-1 bg-terra text-bg0 px-6 py-[14px] font-mono uppercase tracking-[0.16em] text-[11px] hover:opacity-90"
            >
              Share via WhatsApp
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}


    // ════════════════════════════════════════════════════════
    // VIEWS: WeekView, TodayView, MealTile, OverlapBand (agent B output)
    // ════════════════════════════════════════════════════════
// =====================================================================
// components-week-today.txt
// React function components for the meal-planner redesign:
//   - MealTile     : single meal cell for the week strip (empty / single / multi)
//   - WeekView     : Section 02 — Week with tonight hero + day strips
//   - TodayView    : Section 03 — Today with cinematic hero + timeline
//   - OverlapBand  : small helper for timeline overlap coaching
//
// React 18 + Babel-in-browser. function components, no imports/exports.
// Relies on globals: React, MP (from shared.js), getMealRecipes (provided).
// =====================================================================


// ---- helpers ----------------------------------------------------------

// Curated Unsplash food photos used as a deterministic fallback when a
// recipe has no hero_image and no usable YouTube thumbnail.
const FALLBACK_PHOTOS = [
  "1604908176997-125f25cc6f3d",
  "1525351484163-7529414344d8",
  "1547592180-85f173990554",
  "1546069901-ba9599a7e63c",
  "1559847844-5315695dadae",
  "1565958011703-44f9829ba187",
];

function recipePhoto(recipe, w) {
  if (!recipe) return null;
  const yt = recipe.youtube_url ? MP.youtubeThumb(recipe.youtube_url, w >= 800 ? "maxresdefault" : "hqdefault") : null;
  if (yt) return yt;
  if (recipe.hero_image) return recipe.hero_image;
  // hash by id for stable selection
  const id = recipe.id || recipe.name || "x";
  let h = 0; for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) | 0;
  const idx = Math.abs(h) % FALLBACK_PHOTOS.length;
  return `https://images.unsplash.com/photo-${FALLBACK_PHOTOS[idx]}?w=${w || 400}&q=80&auto=format&fit=crop`;
}

// <img> wrapper that swaps to recipe.hero_image, then to a fallback
// Unsplash photo, on error. Keeps things simple: state-less, uses
// dataset markers to track which fallback step we're on.
function RecipeImg({ recipe, size, alt, className }) {
  const [src, setSrc] = React.useState(() => recipePhoto(recipe, size || 400));
  const [stage, setStage] = React.useState(0);
  function onErr() {
    if (stage === 0 && recipe && recipe.hero_image && src !== recipe.hero_image) {
      setSrc(recipe.hero_image); setStage(1); return;
    }
    if (stage <= 1) {
      const id = (recipe && recipe.id) || "x";
      let h = 0; for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) | 0;
      const idx = Math.abs(h) % FALLBACK_PHOTOS.length;
      setSrc(`https://images.unsplash.com/photo-${FALLBACK_PHOTOS[idx]}?w=${size || 400}&q=80&auto=format&fit=crop`);
      setStage(2);
    }
  }
  return <img src={src} alt={alt || ""} onError={onErr}
              className={className || "absolute inset-0 w-full h-full object-cover"} />;
}

// Small vermilion play circle overlay (no border-radius rule allows
// rounded-full because it's a "small dot / play button").
function PlayDot({ size }) {
  const s = size || 28;
  return (
    <span className="absolute top-1.5 right-1.5 rounded-full bg-terra flex items-center justify-center"
          style={{ width: s, height: s }}>
      <span style={{
        width: 0, height: 0,
        borderLeft: `${Math.round(s * 0.32)}px solid #FAFAF7`,
        borderTop: `${Math.round(s * 0.22)}px solid transparent`,
        borderBottom: `${Math.round(s * 0.22)}px solid transparent`,
        marginLeft: 2,
      }} />
    </span>
  );
}

// Mono eyebrow text — small, uppercase, wide tracking.
function Eyebrow({ children, className }) {
  return (
    <div className={`font-mono text-[9px] uppercase tracking-[0.18em] text-warm ${className || ""}`}>
      {children}
    </div>
  );
}

function fmtMins(m) {
  if (!m && m !== 0) return "";
  if (m < 60) return `${m} min`;
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `${h}h ${r}m` : `${h}h`;
}

function firstTag(recipe) {
  const tags = recipe && recipe.tags;
  if (Array.isArray(tags) && tags.length) return String(tags[0]).toLowerCase();
  if (recipe && recipe.cuisine) return String(recipe.cuisine).toLowerCase();
  return "";
}

// Title-case the meal type (breakfast → Breakfast).
function mealLabel(t) {
  if (!t) return "";
  return t.charAt(0).toUpperCase() + t.slice(1);
}

// Index recipes by id for fast lookup.
function indexById(recipes) {
  const out = {};
  for (const r of recipes || []) out[r.id] = r;
  return out;
}


// ---- MealTile ---------------------------------------------------------
// One meal cell in a week-strip. `meal` is the array returned by
// getMealRecipes() — never an object. `recipes` is full library.
// Props:
//   meal       : Array<{recipeId, role}>
//   recipes    : Array<recipe>
//   mealType   : "breakfast"|"lunch"|"dinner"
//   onClick    : () => void   (open editor for this meal)
//   onPlay     : (recipe) => void
//   accent     : optional bool — render label in vermilion (today's now-playing)
//   accentNote : optional string shown in red instead of the normal sub line
function MealTile({ meal, recipes, mealType, onClick, onPlay, accent, accentNote }) {
  const items = Array.isArray(meal) ? meal : [];
  const byId = React.useMemo(() => indexById(recipes), [recipes]);

  // ---- Empty state
  if (items.length === 0) {
    return (
      <button type="button" onClick={onClick}
        className="text-left grid grid-cols-[88px_1fr] gap-4 px-6 py-5 border-r border-border last:border-r-0 w-full hover:bg-bg0 transition">
        <div className="w-[88px] h-[88px]"
             style={{ background: "repeating-linear-gradient(45deg, #EAE3D9 0 6px, #F4F1EC 6px 12px)" }} />
        <div className="min-w-0">
          <Eyebrow>{mealLabel(mealType)}</Eyebrow>
          <div className="font-mono text-[11px] uppercase tracking-[0.14em] text-warm/60 mt-1.5">
            + Add a recipe
          </div>
        </div>
      </button>
    );
  }

  // ---- Multi-recipe layout (2+)
  if (items.length >= 2) {
    let totalMin = 0;
    for (const it of items) {
      const r = byId[it.recipeId];
      if (r && r.cook_time_mins) totalMin += r.cook_time_mins;
    }
    return (
      <div className="px-6 py-4 border-r border-border last:border-r-0 hover:bg-bg0 transition">
        <div className="flex items-baseline gap-2 pb-3 border-b border-border">
          <Eyebrow>
            {mealLabel(mealType)} · {items.length} recipes{totalMin ? ` · ${totalMin} min total` : ""}
          </Eyebrow>
        </div>
        <div className="flex flex-col">
          {items.map((it, i) => {
            const r = byId[it.recipeId];
            if (!r) {
              return (
                <button key={i} type="button" onClick={onClick}
                  className="grid grid-cols-[40px_auto_1fr_auto] gap-3 items-center py-2.5 border-b border-border last:border-b-0 text-left">
                  <div className="w-10 h-10 bg-sand" />
                  <span className="font-mono text-[9px] uppercase tracking-[0.14em] px-1.5 py-1 border border-border text-warm">{it.role || "main"}</span>
                  <span className="font-mono text-[10px] uppercase tracking-[0.14em] text-warm/60">missing recipe</span>
                  <span className="font-mono text-[10px] text-warm/60"></span>
                </button>
              );
            }
            const role = (it.role || "main").toLowerCase();
            const rolePillClass = role === "main"
              ? "border-terra text-terra font-semibold"
              : "border-ink text-ink";
            return (
              <div key={i}
                className="grid grid-cols-[40px_auto_1fr_auto] gap-3 items-center py-2.5 border-b border-border last:border-b-0">
                <button type="button" onClick={() => onPlay && onPlay(r)}
                        className="relative w-10 h-10 bg-sand block">
                  <RecipeImg recipe={r} size={200} />
                  <PlayDot size={18} />
                </button>
                <span className={`font-mono text-[9px] uppercase tracking-[0.14em] px-1.5 py-1 border ${rolePillClass}`}>
                  {role}
                </span>
                <button type="button" onClick={onClick}
                        className="text-left font-display text-[14px] leading-tight text-ink truncate">
                  {r.name}
                </button>
                <span className="font-mono text-[10px] uppercase tracking-[0.14em] text-warm">
                  {r.cook_time_mins ? `${r.cook_time_mins}m` : ""}
                </span>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  // ---- Single recipe layout
  const it = items[0];
  const r = byId[it.recipeId];
  if (!r) {
    return (
      <button type="button" onClick={onClick}
        className="text-left grid grid-cols-[88px_1fr] gap-4 px-6 py-5 border-r border-border last:border-r-0 w-full hover:bg-bg0">
        <div className="w-[88px] h-[88px] bg-sand" />
        <div className="min-w-0">
          <Eyebrow>{mealLabel(mealType)}</Eyebrow>
          <div className="font-display text-[16px] leading-tight mt-1.5">Missing recipe</div>
          <div className="font-mono text-[9px] uppercase tracking-[0.14em] text-warm/60 mt-1.5">{it.recipeId}</div>
        </div>
      </button>
    );
  }

  const sub = accentNote
    ? accentNote
    : `${r.cook_time_mins ? r.cook_time_mins + " min" : ""}${firstTag(r) ? " · " + firstTag(r) : ""}`;
  return (
    <div className="grid grid-cols-[88px_1fr] gap-4 px-6 py-5 border-r border-border last:border-r-0 items-center hover:bg-bg0 transition">
      <button type="button" onClick={() => onPlay && onPlay(r)}
              className="relative w-[88px] h-[88px] bg-sand block">
        <RecipeImg recipe={r} size={200} />
        <PlayDot size={28} />
      </button>
      <button type="button" onClick={onClick} className="text-left min-w-0 w-full">
        <Eyebrow className={accent ? "text-terra" : ""}>
          {mealLabel(mealType)}{accent ? " · Now playing" : ""}
        </Eyebrow>
        <div className="font-display text-[16px] leading-tight mt-1.5 text-ink truncate">
          {r.name}
        </div>
        <div className={`font-mono text-[9px] uppercase tracking-[0.14em] mt-1.5 ${accent ? "text-terra" : "text-warm/60"}`}>
          {sub}
        </div>
      </button>
    </div>
  );
}


// ---- WeekView ---------------------------------------------------------
// Section 02 of the redesign. Tonight hero + 7 day strips + footer.
// Props:
//   recipes      : Array<recipe>
//   plan         : { [dayKey]: { breakfast, lunch, dinner } }
//   todayKey     : "YYYY-MM-DD"
//   onMealClick  : (dayKey, mealType) => void
//   onPlayRecipe : (recipe) => void
//   onPrintWeek  : () => void
//   onShare      : () => void
function WeekView({ recipes, plan, todayKey, onMealClick, onPlayRecipe, onPrintWeek, onShare }) {
  const byId = React.useMemo(() => indexById(recipes), [recipes]);

  // Build Mon→Sun for the week containing todayKey.
  const weekStart = MP.date.mondayOf(todayKey);
  const days = [];
  for (let i = 0; i < 7; i++) days.push(MP.date.addDays(weekStart, i));

  const weekEnd = days[6];
  const weekStartD = MP.date.parse(weekStart);
  const weekStartDay = weekStartD.getDate();
  const weekEndD = MP.date.parse(weekEnd);
  // Approx ISO week number (Mon-based).
  function isoWeek(dateStr) {
    const d = MP.date.parse(dateStr);
    d.setHours(0,0,0,0);
    d.setDate(d.getDate() + 4 - ((d.getDay() + 6) % 7 + 1));
    const y0 = new Date(d.getFullYear(), 0, 1);
    return Math.ceil((((d - y0) / 86400000) + 1) / 7);
  }
  const wkNum = isoWeek(todayKey);
  const monthName = MP.i18n.months.en[weekEndD.getMonth()];
  const yearNum = weekEndD.getFullYear();

  // Tonight = today's dinner (or lunch if dinner empty).
  const todayDay = (plan && plan[todayKey]) || {};
  const tonightMeal = (typeof getMealRecipes === "function" ? getMealRecipes(todayDay.dinner) : []) || [];
  const tonightRecipes = tonightMeal.map((it) => byId[it.recipeId]).filter(Boolean);
  const tonightHero = tonightRecipes[0];
  const tonightDateLabel = `${MP.i18n.days.en[(MP.date.parse(todayKey).getDay() + 6) % 7].slice(0,3)} ${MP.date.parse(todayKey).getDate()} ${MP.i18n.months.en[MP.date.parse(todayKey).getMonth()].slice(0,3)}`;

  // Conflicts for today (used by tonight hero).
  const todayConflicts = MP.schedule.dayConflicts(todayDay, byId);

  // Stats for the hero (sum across tonight's recipes).
  let activeMin = 0, totalMin = 0;
  for (const r of tonightRecipes) {
    activeMin += r.active_time_mins || r.prep_time_mins || 0;
    totalMin  += r.cook_time_mins || 0;
  }
  const serves = todayDay.dinner_serves || (plan && plan.serves) || 4;

  // Compute conflicts for each day (for the strip vermilion accent).
  const dayConflictMap = {};
  for (const k of days) {
    const d = (plan && plan[k]) || {};
    const c = MP.schedule.dayConflicts(d, byId);
    dayConflictMap[k] = c && c.length ? c : null;
  }

  // Variety + protein balance for footer.
  const cuisines = new Set();
  let proteinFish = 0, proteinChicken = 0, proteinVeg = 0;
  let conflictTotal = 0;
  for (const k of days) {
    const day = (plan && plan[k]) || {};
    if (dayConflictMap[k]) conflictTotal += dayConflictMap[k].length;
    for (const m of ["breakfast","lunch","dinner"]) {
      const arr = (typeof getMealRecipes === "function" ? getMealRecipes(day[m]) : []) || [];
      for (const it of arr) {
        const r = byId[it.recipeId]; if (!r) continue;
        if (r.cuisine) cuisines.add(r.cuisine);
        const tags = (r.tags || []).map(t => String(t).toLowerCase());
        if (tags.includes("fish") || tags.includes("seafood") || tags.includes("salmon")) proteinFish++;
        else if (tags.includes("chicken") || tags.includes("poultry")) proteinChicken++;
        else if (tags.includes("vegetarian") || tags.includes("veg")) proteinVeg++;
      }
    }
  }

  return (
    <div className="bg-bg0">
      {/* work-head */}
      <div className="grid grid-cols-[1fr_auto] items-end gap-6 px-9 py-7 border-b border-border">
        <div>
          <Eyebrow className="mb-2">Week {wkNum} · {weekStartDay}–{weekEndD.getDate()} {monthName} {yearNum}</Eyebrow>
          <h1 className="font-display text-[36px] leading-[1.05] tracking-[-0.015em]">This week.</h1>
        </div>
        <div className="flex gap-3 items-center">
          <button onClick={onPrintWeek}
            className="font-mono text-[11px] uppercase tracking-[0.16em] px-4 py-2.5 border border-border text-ink hover:bg-sand">
            Print week
          </button>
          <button onClick={onShare}
            style={{ minHeight: 44 }} className="font-mono text-[11px] uppercase tracking-[0.16em] px-4 py-3 bg-ink text-bg0 hover:bg-terra">
            Share
          </button>
        </div>
      </div>

      {/* tonight hero */}
      <div className="grid grid-cols-1 md:grid-cols-[1.4fr_1fr] bg-ink text-bg0 md:min-h-[460px] relative border-b border-border">
        <div className="relative bg-ink min-h-[260px] md:min-h-[460px] overflow-hidden">
          {tonightHero && <RecipeImg recipe={tonightHero} size={1200}
                          className="absolute inset-0 w-full h-full object-cover opacity-90" />}
          <div className="absolute inset-0"
               style={{ background: "linear-gradient(180deg, rgba(0,0,0,0.05) 0%, rgba(26,26,26,0) 30%, rgba(26,26,26,0.55) 100%)" }} />
          {tonightHero && (
            <button type="button" onClick={() => onPlayRecipe && onPlayRecipe(tonightHero)}
              className="absolute left-1/2 top-1/2 rounded-full bg-terra flex items-center justify-center"
              style={{ width: 96, height: 96, transform: "translate(-50%,-50%)",
                       boxShadow: "0 0 0 16px rgba(200,57,43,0.18)" }}>
              <span style={{ width: 0, height: 0,
                borderLeft: "26px solid #FAFAF7",
                borderTop: "17px solid transparent",
                borderBottom: "17px solid transparent",
                marginLeft: 4 }} />
            </button>
          )}
          {/* pulse top-left */}
          <div className="absolute top-6 left-6 z-10 inline-flex items-center gap-2.5 font-mono text-[10px] uppercase tracking-[0.18em] text-bg0">
            <span className="rounded-full bg-terra" style={{ width: 8, height: 8, animation: "mp-pulse 1800ms ease-in-out infinite" }} />
            Tonight · {tonightDateLabel}
          </div>
        </div>

        <div className="flex flex-col justify-between p-12">
          <div>
            <Eyebrow className="text-terra mb-4 tracking-[0.18em]">Tonight's dinner</Eyebrow>
            <h2 className="font-display font-normal text-[56px] leading-[1.0] tracking-[-0.02em]">
              {tonightRecipes.length === 0
                ? "No dinner planned."
                : tonightRecipes.length === 1
                  ? tonightRecipes[0].name + "."
                  : tonightRecipes.map(r => r.name).join(" + ") + "."}
            </h2>
            {tonightRecipes.length > 1 && (
              <p className="font-display text-[17px] leading-[1.5] mt-5 max-w-[380px]"
                 style={{ color: "rgba(250,250,247,0.78)" }}>
                {tonightRecipes.length} recipes, one kitchen. Careful timing.
              </p>
            )}
          </div>
          <div>
            {todayConflicts && todayConflicts.length > 0 && (
              <div className="inline-flex items-center gap-2 px-3.5 py-2.5 mb-6 bg-terra text-bg0 font-mono text-[11px] uppercase tracking-[0.14em]">
                ⚠ {todayConflicts.length === 1 ? "Stove conflict" : `${todayConflicts.length} conflicts`}
              </div>
            )}
            <div className="flex gap-9 pt-6" style={{ borderTop: "1px solid rgba(250,250,247,0.18)" }}>
              <div>
                <div className="font-mono text-[10px] uppercase tracking-[0.18em]" style={{ color: "rgba(250,250,247,0.5)" }}>Serves</div>
                <div className="font-display text-[22px] leading-[1.1] mt-1">{serves}</div>
              </div>
              <div>
                <div className="font-mono text-[10px] uppercase tracking-[0.18em]" style={{ color: "rgba(250,250,247,0.5)" }}>Active</div>
                <div className="font-display text-[22px] leading-[1.1] mt-1">{activeMin || "—"} min</div>
              </div>
              <div>
                <div className="font-mono text-[10px] uppercase tracking-[0.18em]" style={{ color: "rgba(250,250,247,0.5)" }}>Total</div>
                <div className="font-display text-[22px] leading-[1.1] mt-1">{totalMin || "—"} min</div>
              </div>
              <div>
                <div className="font-mono text-[10px] uppercase tracking-[0.18em]" style={{ color: "rgba(250,250,247,0.5)" }}>Recipes</div>
                <div className="font-display text-[22px] leading-[1.1] mt-1">{tonightRecipes.length || 0}</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      {/* week strips */}
      <div>
        {days.map((dayKey) => {
          const isToday = dayKey === todayKey;
          const day = (plan && plan[dayKey]) || {};
          const d = MP.date.parse(dayKey);
          const dn = MP.i18n.days.en[(d.getDay() + 6) % 7].slice(0,3);
          const dd = d.getDate();
          const dy = MP.i18n.months.en[d.getMonth()].slice(0,3);
          const conflicted = !!dayConflictMap[dayKey];

          return (
            <div key={dayKey}
                 className={`grid grid-cols-[64px_1fr] md:grid-cols-[92px_1fr] border-b border-border hover:bg-bg0 transition ${isToday ? "border-t-2 border-t-terra" : ""}`}>
              <div className="py-4 md:py-6 pl-4 md:pl-7 pr-0 border-r border-border">
                <div className={`font-mono text-[10px] uppercase tracking-[0.18em] ${isToday ? "text-terra" : "text-warm"}`}>
                  {dn}{isToday ? " · today" : ""}
                </div>
                <div className="font-display text-[28px] md:text-[38px] leading-none mt-2 text-ink">{dd}</div>
                <div className="font-mono text-[9px] uppercase tracking-[0.14em] text-warm/60 mt-2">{dy}</div>
              </div>
              <div className={`grid grid-cols-1 md:grid-cols-3 ${conflicted && isToday ? "" : ""}`}
                   style={ conflicted ? {
                     background: "linear-gradient(90deg, transparent 0%, rgba(200,57,43,0.06) 65%, rgba(200,57,43,0.10) 100%)"
                   } : undefined }>
                {["breakfast","lunch","dinner"].map((m) => {
                  const arr = (typeof getMealRecipes === "function" ? getMealRecipes(day[m]) : []) || [];
                  const accent = isToday && m === "dinner" && arr.length > 0;
                  let accentNote = null;
                  if (accent && conflicted) {
                    accentNote = "⚠ stove overlap";
                  }
                  return (
                    <MealTile key={m}
                      meal={arr}
                      recipes={recipes}
                      mealType={m}
                      onClick={() => onMealClick && onMealClick(dayKey, m)}
                      onPlay={(r) => onPlayRecipe && onPlayRecipe(r)}
                      accent={accent}
                      accentNote={accentNote}
                    />
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>

      {/* keyframes for the pulse + ken-burns (scoped via style tag) */}
      <style>{`
        @keyframes mp-pulse {
          0%,100% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 rgba(200,57,43,0.55); }
          50%     { transform: scale(1.18); opacity: 0.85; box-shadow: 0 0 0 8px rgba(200,57,43,0); }
        }
        @keyframes mp-kenburns {
          0%   { transform: scale(1.0) translate(0,0); }
          100% { transform: scale(1.08) translate(-1.5%, 1%); }
        }
      `}</style>
    </div>
  );
}


// ---- OverlapBand ------------------------------------------------------

// fight for the same tool (oven, stove). Plain text coaching message.

  return (
    <div className="grid grid-cols-[auto_1fr] gap-5 items-center px-5 py-3.5 mb-4 -ml-5"
         style={{
           borderTop: "1px solid #C8392B",
           borderBottom: "1px solid #C8392B",
           background: "rgba(200,57,43,0.06)",
         }}>
      <span className="font-mono text-[10px] uppercase tracking-[0.18em] text-terra font-semibold">
        {label || "Overlap"}
      </span>
      <span className="font-display text-[15px] leading-[1.4] text-ink">
        {message}
      </span>
    </div>
  );
}


// ---- TodayView --------------------------------------------------------
// Section 03 of the redesign. Cinematic hero + tonight strip + timeline.
// Props:
//   recipes      : Array<recipe>
//   plan         : { [dayKey]: { breakfast, lunch, dinner } }
//   todayKey     : "YYYY-MM-DD"
//   lang         : "en" | "tl" | "il"
//   onLangChange : (lang) => void
//   onPlayRecipe : (recipe) => void
//   onPrintToday : () => void
//   onShare      : () => void
function TodayView({ recipes, plan, todayKey, lang, onLangChange, onPlayRecipe, onPrintToday, onShare }) {
  const byId = React.useMemo(() => indexById(recipes), [recipes]);
  const day = (plan && plan[todayKey]) || {};
  const tomorrowKey = MP.date.addDays(todayKey, 1);
  const nextDay = (plan && plan[tomorrowKey]) || null;
  const langCur = lang || "en";

  const d = MP.date.parse(todayKey);
  const dayName = MP.i18n.days.en[(d.getDay() + 6) % 7];
  const ddNum = d.getDate();
  const monthName = MP.i18n.months.en[d.getMonth()];
  const yearNum = d.getFullYear();

  // Pick the hero: dinner main if any, else lunch first, else breakfast first.
  function pickHero() {
    for (const m of ["dinner","lunch","breakfast"]) {
      const arr = (typeof getMealRecipes === "function" ? getMealRecipes(day[m]) : []) || [];
      for (const it of arr) {
        if ((it.role || "main") === "main") {
          const r = byId[it.recipeId]; if (r) return { recipe: r, meal: m };
        }
      }
      if (arr.length) {
        const r = byId[arr[0].recipeId]; if (r) return { recipe: r, meal: m };
      }
    }
    return null;
  }
  const hero = pickHero();
  const heroRecipe = hero && hero.recipe;

  // Default serve time of hero meal
  const heroMealServeMin = hero
    ? (MP.schedule.parseHM(day[hero.meal + "_time"]) ?? ({ breakfast: 7*60+15, lunch: 12*60, dinner: 18*60+30 }[hero.meal]))
    : null;
  const heroSched = (heroRecipe && hero) ? MP.schedule.forMeal(hero.meal, heroRecipe, { mealTime: day[hero.meal + "_time"] }) : null;

  // Tasks for the day timeline.
  const tasks = MP.schedule.buildDayTasks(day, nextDay, byId, {});

  // Conflicts for overlap bands.
  const conflicts = MP.schedule.dayConflicts(day, byId) || [];

  // Find the "before bed" prep task (defrost / overnight marinate).
  const prepTask = tasks.find((t) => (t.kind === "defrost" || (t.kind === "marinate" && t.priority === 0)));

  // Filter timeline events to "cook" + "serve" rows. Same-day cook tasks
  // become the cook events; serves for each meal become serve events.
  const cookEvents = tasks.filter((t) => t.kind === "cook");

  // Display: cook events in order, then serve events at end (most useful).

  const events = [...cookEvents, ...serveEvents].sort((a, b) => a.at - b.at || a.priority - b.priority);

  function conflictForMeal(meal) {
    for (const pair of conflicts) {

                      <a href={r.youtube_url} target="_blank" rel="noopener noreferrer"

          })}
        </div>
      </div>

      <style>{`

          0%   { transform: scale(1.0) translate(0,0); }

        }
      `}</style>
    </div>
  );
}

// Cycle of Unsplash IDs as last-resort fallback for recipe thumbs.
const __FALLBACK_PHOTOS = [
  "1604908176997-125f25cc6f3d",
  "1525351484163-7529414344d8",
  "1547592180-85f173990554",
  "1546069901-ba9599a7e63c",
  "1559847844-5315695dadae",
  "1565958011703-44f9829ba187",
];

function unsplashUrl(id, w) {
  return `https://images.unsplash.com/photo-${id}?w=${w || 600}&q=80&auto=format&fit=crop`;
}

// Pick a recipe thumb URL with graceful chain: youtube maxres → hero_image → unsplash fallback.
// The actual element should still wire onError to handle 404s; this just picks the *first* try.
function pickRecipeThumb(recipe, fallbackIndex) {
  if (!recipe) return unsplashUrl(__FALLBACK_PHOTOS[0]);
  const yt = recipe.youtube_url ? (window.MP && MP.youtubeThumb && MP.youtubeThumb(recipe.youtube_url, "maxresdefault")) : null;
  if (yt) return yt;
  if (recipe.hero_image) return recipe.hero_image;
  const idx = ((fallbackIndex || 0) % __FALLBACK_PHOTOS.length + __FALLBACK_PHOTOS.length) % __FALLBACK_PHOTOS.length;
  return unsplashUrl(__FALLBACK_PHOTOS[idx]);
}

// onError chain for recipe thumbs: maxres → hq → hero_image → unsplash → hide.
function recipeThumbOnError(recipe, fallbackIndex) {
  return function (e) {
    const s = e.target.src;
    if (s.includes("maxresdefault")) { e.target.src = s.replace("maxresdefault", "hqdefault"); return; }
    if (s.includes("hqdefault")) { e.target.src = s.replace("hqdefault", "mqdefault"); return; }
    if (recipe && recipe.hero_image && s !== recipe.hero_image) { e.target.src = recipe.hero_image; return; }
    const idx = ((fallbackIndex || 0) % __FALLBACK_PHOTOS.length + __FALLBACK_PHOTOS.length) % __FALLBACK_PHOTOS.length;
    const fb = unsplashUrl(__FALLBACK_PHOTOS[idx]);
    if (s !== fb) { e.target.src = fb; return; }
    e.target.style.display = "none";
  };
}

// Lang-aware recipe name lookup.
function recipeName(recipe, lang) {
  if (!recipe) return "";
  if (lang === "tl" && recipe.name_tl) return recipe.name_tl;
  if (lang === "il" && recipe.name_il) return recipe.name_il;
  return recipe.name || "";
}

// Source pill copy + classes. The single use of vermilion in the row is "wet-market".
function sourcePillMeta(source) {
  switch (source) {
    case "wet-market":
    case "market":
      return { label: "Wet market", cls: "bg-terra text-cream" };
    case "fusion":
    case "marketplace":
      return { label: "Fusion", cls: "bg-sand text-ink" };
    case "hktv":
    case "hktvmall":
      return { label: "HKTVmall", cls: "bg-bg0 text-ink" };
    case "pantry":
    case "on-hand":
      return { label: "On hand", cls: "bg-cream text-warm" };
    default:
      return { label: (source || "Other").toString(), cls: "bg-bg0 text-warm" };
  }
}

// Format an ingredient amount as a compact "qty + unit" mono cell.
function formatQty(amount, unit) {
  if (amount === null || amount === undefined || amount === "") return unit ? unit : "—";
  const n = typeof amount === "number" ? amount : amount;
  if (!unit || unit === "count" || unit === "ea") return `${n}`;
  return `${n} ${unit}`;
}

// Day-of-week short label from ISO date string.
function dayShort(iso) {
  const d = new Date(iso + "T00:00:00");
  return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()];
}

        <button
          onClick={onStartCooking}
          className="w-full bg-terra text-cream font-mono uppercase tracking-[0.16em] text-xs py-3 hover:bg-ink transition mt-auto"
        >
          Start cooking timer →
        </button>
      </aside>
    </div>
  );
}

// 2) PantryView
//
// Shopping / pantry view. Section 05 of redesign-vision. Lead = By meal.
//
// Props:
//   recipes        — full recipe library
//   plan           — weekplan { days: [{date, breakfast, lunch, dinner, ..._serves}], serves }
//   weekRange      — { start, end } ISO strings (informational; not strictly required)
//   onPlayRecipe   — (recipe) => void   open VideoPlayerModal
//   onPrint        — () => void
//   onSendToHelper — () => void
// ═════════════════════════════════════════════════════════════════════════════

function PantryView({ recipes, plan, weekRange, onPlayRecipe, onPrint, onSendToHelper }) {
  const [view, setView] = React.useState("meal"); // "meal" | "store" | "recipe"
  const [checked, setChecked] = React.useState({}); // key: meal-key|item-idx → bool
  const recipeMap = React.useMemo(() => {
    const m = {};
    (recipes || []).forEach((r) => { m[r.id] = r; });
    return m;
  }, [recipes]);

  const today = (window.MP && MP.date && MP.date.hkToday) ? MP.date.hkToday() : new Date().toISOString().slice(0, 10);

  // Build per-meal cards. Iterate plan.days × meal types × recipe ids.
  // Limit to upcoming meals — today and after — show max 6.
  const mealCards = React.useMemo(() => {
    if (!plan || !plan.days) return [];
    const cards = [];
    const servesDefault = plan.serves || 4;
    for (const day of plan.days) {
      if (day.date < today) continue;
      for (const mealType of ["breakfast", "lunch", "dinner"]) {
        const ids = (window.MP && MP.getMealRecipeIds) ? MP.getMealRecipeIds(day, mealType) : [];
        if (!ids.length) continue;
        const dayRecipes = ids.map((id) => recipeMap[id]).filter(Boolean);
        if (!dayRecipes.length) continue;

        // Dedupe ingredients within this meal (item|source key → first-seen with summed amount).
        const ingMap = new Map();
        for (const r of dayRecipes) {
          for (const ing of r.ingredients || []) {
            const key = `${(ing.item || "").toLowerCase().trim()}|${ing.source || "other"}`;
            const prev = ingMap.get(key);
            if (prev) {
              if (typeof prev.amount === "number" && typeof ing.amount === "number" && prev.unit === ing.unit) {
                prev.amount += ing.amount;
              }
            } else {
              ingMap.set(key, Object.assign({}, ing));
            }
          }
        }
        const ingredients = Array.from(ingMap.values());
        const serves = day[mealType + "_serves"] || servesDefault;

        cards.push({
          key: `${day.date}-${mealType}`,
          date: day.date,
          mealType,
          recipes: dayRecipes,
          ingredients,
          serves,
          isToday: day.date === today,
          heroRecipe: dayRecipes[0],
          title: dayRecipes.map((r) => r.name).join(" + "),
        });

        if (cards.length >= 6) break;
      }
      if (cards.length >= 6) break;
    }
    return cards;
  }, [plan, recipeMap, today]);

  // Pantry items collapsed at bottom — "on hand" / pantry category items across the week.
  const pantryItems = React.useMemo(() => {
    const seen = new Set();
    for (const card of mealCards) {
      for (const ing of card.ingredients) {
        if ((ing.category === "pantry" || ing.source === "pantry" || ing.source === "on-hand") && ing.item) {
          seen.add(ing.item);
        }
      }
    }
    return Array.from(seen);
  }, [mealCards]);

  const totalIngredients = mealCards.reduce((s, c) => s + c.ingredients.length, 0);

  return (
    <div className="bg-cream text-ink">

      {/* ── pantry-hero ─────────────────────────────────────────── */}
      <div className="grid grid-cols-1 md:grid-cols-2 border border-border bg-cream">
        <div className="p-9 flex flex-col justify-between order-2 md:order-1">
          <div>
            <div className="font-mono uppercase tracking-[0.16em] text-[11px] text-warm mb-2">
              {totalIngredients} ingredients · across {mealCards.length} meals
            </div>
            <h1 className="font-display text-[44px] leading-[1.0] tracking-[-0.015em]">
              What to buy <em className="text-terra not-italic" style={{ fontStyle: "italic" }}>for what</em>.
            </h1>
            <p className="font-display text-[17px] text-warm mt-4 leading-[1.5] max-w-[420px]">
              Each meal carries its own list. Stop guessing whether the lemons are for the fish or the salad — every row tells you.
            </p>
          </div>
          <div className="flex gap-3 mt-8">
            <button
              onClick={onSendToHelper}
              style={{ minHeight: 44 }}
              className="bg-ink text-cream font-mono uppercase tracking-[0.16em] text-xs px-5 py-3.5 hover:bg-terra transition"
            >
              Send to Leni
            </button>
            <button
              onClick={onPrint}
              style={{ minHeight: 44 }}
              className="bg-cream text-ink border border-border font-mono uppercase tracking-[0.16em] text-xs px-5 py-3.5 hover:bg-bg0 transition"
            >
              Print
            </button>
          </div>
        </div>
        <div className="bg-bg0 min-h-[200px] md:min-h-[280px] order-1 md:order-2">
          <img
            src="https://images.unsplash.com/photo-1488459716781-31db52582fe9?w=900&q=80&auto=format&fit=crop"
            alt="Wet market produce"
            className="w-full h-full object-cover block"
          />
        </div>
      </div>

      {/* ── view toggle ─────────────────────────────────────────── */}
      <div className="flex border-x border-b border-border bg-cream">
        {[
          { k: "meal", label: `By meal · ${mealCards.length} meals`, num: "A" },
          { k: "store", label: "By store · 4 sources", num: "B" },
          { k: "recipe", label: `By recipe · ${(plan && plan.days ? new Set(mealCards.flatMap((c) => c.recipes.map((r) => r.id))).size : 0)} recipes`, num: "C" },
        ].map((t) => {
          const on = view === t.k;
          return (
            <button
              key={t.k}
              onClick={() => setView(t.k)}
              className={`flex-1 px-6 py-4 border-r border-border last:border-r-0 font-mono uppercase tracking-[0.16em] text-[11px] text-left transition ${on ? "bg-ink text-cream" : "bg-cream text-ink hover:bg-bg0"}`}
            >
              <span className="opacity-60 mr-3">{t.num}</span>{t.label}
            </button>
          );
        })}
      </div>

      {/* ── BY MEAL view ────────────────────────────────────────── */}
      {view === "meal" && (
        <div className="border-x border-b border-border">
          {mealCards.length === 0 && (
            <div className="p-9 text-center font-display text-warm">
              No upcoming meals planned this week.
            </div>
          )}
          {mealCards.map((card, ci) => {
            const checkedCount = card.ingredients.reduce((s, _, i) => s + (checked[`${card.key}|${i}`] ? 1 : 0), 0);
            const eyebrow = `${dayShort(card.date)} ${card.mealType}${card.isToday ? " · tonight" : ""} · serves ${card.serves}`;
            return (
              <div key={card.key} className="grid grid-cols-1 md:grid-cols-[280px_1fr] border-b border-border last:border-b-0">
                {/* photo */}
                <div className="relative bg-bg0 min-h-[200px] md:min-h-[260px]">
                  <img
                    src={pickRecipeThumb(card.heroRecipe, ci)}
                    alt=""
                    className="w-full h-full object-cover block absolute inset-0"
                    onError={recipeThumbOnError(card.heroRecipe, ci)}
                  />
                  <button
                    onClick={() => onPlayRecipe && onPlayRecipe(card.heroRecipe)}
                    aria-label="Play video"
                    className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-14 h-14 rounded-full bg-cream/95 text-ink flex items-center justify-center hover:bg-terra hover:text-cream transition"
                  >
                    <span className="ml-1" style={{ borderTop: "8px solid transparent", borderBottom: "8px solid transparent", borderLeft: "12px solid currentColor", width: 0, height: 0, display: "inline-block" }} />
                  </button>
                </div>

                {/* body */}
                <div className="p-7">
                  <div className={`font-mono uppercase tracking-[0.16em] text-[11px] mb-2 ${card.isToday ? "text-terra" : "text-ink"}`}>
                    {eyebrow}
                  </div>
                  <h3 className="font-display text-[24px] leading-[1.1] mb-5">{card.title}</h3>

                  <ul>
                    {card.ingredients.map((ing, i) => {
                      const k = `${card.key}|${i}`;
                      const on = !!checked[k];
                      const meta = sourcePillMeta(ing.source);
                      return (
                        <li
                          key={k}
                          onClick={() => setChecked((c) => Object.assign({}, c, { [k]: !c[k] }))}
                          className="grid grid-cols-[12px_1fr_auto_auto] items-center gap-3 py-2 border-b border-border/60 cursor-pointer select-none"
                        >
                          <span className={`inline-block w-3 h-3 border ${on ? "bg-ink border-ink" : "bg-cream border-ink"}`} />
                          <span className={`font-display text-sm ${on ? "line-through text-warm" : "text-ink"}`}>
                            {ing.item}
                          </span>
                          <span className={`font-mono uppercase tracking-[0.14em] text-[9px] px-2 py-0.5 ${meta.cls}`}>
                            {meta.label}
                          </span>
                          <span className="font-mono text-[11px] text-warm tabular-nums min-w-[3rem] text-right">
                            {formatQty(ing.amount, ing.unit)}
                          </span>
                        </li>
                      );
                    })}
                  </ul>

                  <div className="flex items-center justify-between mt-4 pt-3 border-t border-border">
                    <span className="font-mono uppercase tracking-[0.16em] text-[10px] text-warm">
                      <b className="text-ink">{checkedCount} of {card.ingredients.length}</b> in basket
                    </span>
                    <span className="font-mono uppercase tracking-[0.16em] text-[10px] text-warm">
                      {card.recipes.length > 1 ? `${card.recipes.length} dishes` : `${(card.heroRecipe.prep_time_mins || 0) + (card.heroRecipe.cook_time_mins || 0)} min total`}
                    </span>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* ── BY STORE view (stub) ────────────────────────────────── */}
      {view === "store" && (
        <div className="border-x border-b border-border p-9 text-center">
          <div className="font-mono uppercase tracking-[0.16em] text-[10px] text-warm mb-2">By store</div>
          <p className="font-display text-warm">
            Showing aggregated by store — uses <code className="font-mono text-[12px]">MP.buildShoppingList(recipes, plan)</code>.
          </p>
        </div>
      )}

      {/* ── BY RECIPE view (stub) ───────────────────────────────── */}
      {view === "recipe" && (
        <div className="border-x border-b border-border p-9 text-center">
          <div className="font-mono uppercase tracking-[0.16em] text-[10px] text-warm mb-2">By recipe</div>
          <p className="font-display text-warm">Showing one list per recipe in the plan.</p>
        </div>
      )}

      {/* ── pantry items collapsed ──────────────────────────────── */}
      {pantryItems.length > 0 && (
        <div className="border-x border-b border-border bg-bg0 px-9 py-6">
          <div className="flex items-center justify-between flex-wrap gap-3">
            <span className="font-mono uppercase tracking-[0.16em] text-[10px] text-terra">
              {pantryItems.length} items already on hand · hidden
            </span>
            <span className="font-mono uppercase tracking-[0.14em] text-[10px] text-warm/70">
              {pantryItems.join(" · ")}
            </span>
          </div>
        </div>
      )}
    </div>
  );
}

// 3) RecipesView
//
// Recipe library — editorial register, preserves filter/search/sort UX.
//
// Props:
//   recipes         — full recipe library
//   onPlayRecipe    — (recipe) => void   open VideoPlayerModal

function RecipesView({ recipes, onPlayRecipe, onSelectRecipe, onAddRecipe }) {
  const [q, setQ] = React.useState("");
  const [cuisine, setCuisine] = React.useState("all");
  const [mealType, setMealType] = React.useState("all");

  const cuisines = React.useMemo(() => {
    return ["all"].concat(Array.from(new Set((recipes || []).map((r) => r.cuisine).filter(Boolean))));
  }, [recipes]);

  const filtered = React.useMemo(() => {
    return (recipes || [])
      .filter((r) => mealType === "all" ? true : (r.meal_type || []).includes(mealType))
      .filter((r) => cuisine === "all" ? true : r.cuisine === cuisine)
      .filter((r) => q ? (r.name || "").toLowerCase().includes(q.toLowerCase()) : true);
  }, [recipes, mealType, cuisine, q]);

  return (
    <div className="bg-cream text-ink">

      {/* work-head */}
      <div className="border border-border p-9 grid grid-cols-1 md:grid-cols-[1fr_auto] gap-6 items-end bg-cream">
        <div>
          <div className="font-mono uppercase tracking-[0.16em] text-[11px] text-warm mb-2">
            Recipe library · {(recipes || []).length} recipes
          </div>
          <h1 className="font-display text-[44px] leading-[1.0] tracking-[-0.015em]">Recipes.</h1>
        </div>
        <button
          onClick={onAddRecipe}
          className="bg-terra text-cream font-mono uppercase tracking-[0.16em] text-xs px-4 py-3 hover:bg-ink transition"
        >
          + Add recipe
        </button>
      </div>

      {/* filter row */}
      <div className="border-x border-b border-border bg-cream p-6 flex flex-wrap gap-3 items-center">
        {/* cuisine pills */}
        <div className="flex flex-wrap gap-1">
          {cuisines.map((c) => {
            const on = cuisine === c;
            return (
              <button
                key={c}
                onClick={() => setCuisine(c)}
                className={`font-mono uppercase tracking-[0.16em] text-[10px] px-3 py-2 border border-border ${on ? "bg-terra text-cream border-terra" : "bg-cream text-ink hover:bg-bg0"}`}
              >
                {c === "all" ? "All cuisines" : c}
              </button>
            );
          })}
        </div>

        {/* meal-type filter */}
        <div className="flex border border-border ml-auto">
          {[
            { k: "all", label: "Any" },
            { k: "breakfast", label: "Breakfast" },
            { k: "lunch", label: "Lunch" },
            { k: "dinner", label: "Dinner" },
          ].map((m) => {
            const on = mealType === m.k;
            return (
              <button
                key={m.k}
                onClick={() => setMealType(m.k)}
                className={`font-mono uppercase tracking-[0.16em] text-[10px] px-3 py-2 border-r border-border last:border-r-0 ${on ? "bg-terra text-cream" : "bg-cream text-ink hover:bg-bg0"}`}
              >
                {m.label}
              </button>
            );
          })}
        </div>

        {/* search */}
        <input
          value={q}
          onChange={(e) => setQ(e.target.value)}
          placeholder="Search recipes…"
          className="font-display text-base bg-cream border border-border px-4 py-2 min-w-[220px] focus:outline-none focus:border-ink placeholder:text-warm/60"
        />
      </div>

      {/* count */}
      <div className="border-x border-b border-border bg-cream px-6 py-3">
        <span className="font-mono uppercase tracking-[0.16em] text-[10px] text-warm">
          Showing {filtered.length} of {(recipes || []).length}
        </span>
      </div>

      {/* grid */}
      <div className="border-x border-b border-border bg-cream p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        {filtered.map((r, idx) => {
          const thumb = pickRecipeThumb(r, idx);
          const total = (r.prep_time_mins || 0) + (r.cook_time_mins || 0);
          return (
            <div key={r.id} className="border border-border bg-cream flex flex-col">
              {/* photo with play overlay */}
              <div
                className="relative bg-bg0 cursor-pointer"
                style={{ aspectRatio: "4 / 3" }}
                onClick={() => onPlayRecipe && onPlayRecipe(r)}
              >
                <img
                  src={thumb}
                  alt=""
                  className="w-full h-full object-cover block absolute inset-0"
                  onError={recipeThumbOnError(r, idx)}
                />
                <button
                  onClick={(e) => { e.stopPropagation(); onPlayRecipe && onPlayRecipe(r); }}
                  aria-label="Play video"
                  className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-cream/95 text-ink flex items-center justify-center hover:bg-terra hover:text-cream transition"
                >
                  <span style={{ borderTop: "6px solid transparent", borderBottom: "6px solid transparent", borderLeft: "9px solid currentColor", marginLeft: "2px", width: 0, height: 0, display: "inline-block" }} />
                </button>
              </div>

              {/* body — click opens editor */}
              <div
                className="p-4 cursor-pointer flex-1 flex flex-col"
                onClick={() => onSelectRecipe && onSelectRecipe(r)}
              >
                <div className="font-mono uppercase tracking-[0.16em] text-[10px] text-warm mb-2">
                  {r.cuisine || "—"} · {total || (r.cook_time_mins || 0)} min
                </div>
                <h3 className="font-display text-[20px] leading-[1.1] text-ink mb-3">{r.name}</h3>
                <div className="flex flex-wrap gap-1 mt-auto">
                  {(r.meal_type || []).map((m) => (
                    <span
                      key={m}
                      className="font-mono uppercase tracking-[0.14em] text-[9px] px-2 py-0.5 border border-border text-warm"
                    >
                      {m}
                    </span>
                  ))}
                </div>
              </div>
            </div>
          );
        })}
        {filtered.length === 0 && (
          <div className="col-span-full p-9 text-center font-display text-warm">
            No recipes match these filters.
          </div>
        )}
      </div>
    </div>
  );
}

    function planByDate(weekplan) {
      // Convert {days: [{date, breakfast, lunch, dinner}]} → {[date]: dayObj}
      if (!weekplan || !weekplan.days) return {};
      const out = {};
      for (const d of weekplan.days) {
        if (d && d.date) out[d.date] = d;
      }
      return out;
    }

    function App() {
      const [recipes, setRecipes] = useState([]);
      const [weekplan, setWeekplan] = useState(null);
      const [view, setView] = useState("week");
      const [activeRecipe, setActiveRecipe] = useState(null);
      const [showOnboarding, setShowOnboarding] = useState(
        () => !localStorage.getItem("mp_onboarded")
      );
      const [lang, setLang] = useState(() => localStorage.getItem("mp_lang") || "en");

      // Load data — try cloud first (if token), fall back to bundled seed so the
      // app always opens with content. Token is only needed to sync your weekly plan.
      useEffect(() => {
        const loadSeed = () =>
          fetch("./recipes.seed.json").then((r) => r.json()).catch(() => []);

        if (MP.api.hasToken()) {
          Promise.all([
            MP.api.getRecipes().catch(() => null),
            MP.api.getWeekplan().catch(() => null),
          ]).then(async ([recs, plan]) => {
            const finalRecs = Array.isArray(recs) && recs.length ? recs : await loadSeed();
            setRecipes(finalRecs);
            setWeekplan(plan);
          });
        } else {
          loadSeed().then((recs) => {
            setRecipes(Array.isArray(recs) ? recs : []);
            setWeekplan(null);
          });
        }
      }, []);

      const todayKey = MP.date.hkToday();
      const planMap = useMemo(() => planByDate(weekplan), [weekplan]);

      const completeOnboarding = () => {
        localStorage.setItem("mp_onboarded", "1");
        setShowOnboarding(false);
      };
      const onLangChange = (l) => {
        setLang(l);
        localStorage.setItem("mp_lang", l);
      };

      if (showOnboarding) {
        return <Onboarding onContinue={completeOnboarding} />;
      }

      // Token entry available from Settings — but app always opens with seed data.

      const playRecipe = (recipe) => setActiveRecipe(recipe);
      const closePlayer = () => setActiveRecipe(null);

      const print = () => window.print();
      const share = () => {
        const url = window.location.href;
        if (navigator.share) {
          navigator.share({ title: "Meal Planner", url }).catch(() => {});
        } else if (navigator.clipboard) {
          navigator.clipboard.writeText(url).then(() => alert("Link copied"));
        } else {
          prompt("Copy this URL:", url);
        }
      };

      const members = [
        { name: "Faith Lantz", email: "faith@lantz.com", perm: "owner", initial: "F" },
        { name: "Leni", email: "leni@whatsapp · magic link", perm: "cook", initial: "L" },
      ];

      let content;
      if (view === "week") {
        content = (
          <WeekView
            recipes={recipes}
            plan={planMap}
            todayKey={todayKey}
            onMealClick={() => {}}
            onPlayRecipe={playRecipe}
            onPrintWeek={print}
            onShare={share}
          />
        );
      } else if (view === "today") {
        content = (
          <TodayView
            recipes={recipes}
            plan={planMap}
            todayKey={todayKey}
            lang={lang}
            onLangChange={onLangChange}
            onPlayRecipe={playRecipe}
            onPrintToday={print}
            onShare={share}
          />
        );
      } else if (view === "pantry") {
        content = (
          <PantryView
            recipes={recipes}
            plan={planMap}
            weekRange={weekplan && { start: weekplan.week_start }}
            onPlayRecipe={playRecipe}
            onPrint={print}
            onSendToHelper={share}
          />
        );
      } else if (view === "recipes") {
        content = (
          <RecipesView
            recipes={recipes}
            onPlayRecipe={playRecipe}
            onSelectRecipe={() => {}}
            onAddRecipe={() => {}}
          />
        );
      } else if (view === "settings") {
        content = (
          <SettingsView
            members={members}
            onInvite={(d) => console.log("invite", d)}
            onRevoke={(m) => console.log("revoke", m)}
            onCopyMagicLink={(p) => console.log("magic-link", p)}
          />
        );
      }

      return (
        <React.Fragment>
          <AppShell activeView={view} onNavigate={setView} header={null}>
            {content}
          </AppShell>
          {activeRecipe && (
            <VideoPlayerModal
              recipe={activeRecipe}
              lang={lang}
              onClose={closePlayer}
              onLangChange={onLangChange}
              onStartCooking={() => { closePlayer(); setView("today"); }}
            />
          )}
          <footer className="text-center text-[11px] text-warm/40 py-6 select-none no-print">
            {APP_VERSION}
          </footer>
        </React.Fragment>
      );
    }

    function TokenSetup({ onSet }) {

      return (
        <div className="min-h-screen flex items-center justify-center p-6">
          <div className="max-w-md w-full border border-border p-8 bg-bg0">
            <div className="text-[11px] font-mono uppercase tracking-[0.16em] text-warm mb-3">First-time setup</div>
            <h1 className="font-display text-3xl mb-4">Paste your access token.</h1>
            <p className="text-sm text-warm leading-relaxed mb-6">
              The meal plan is private. Paste the token your owner shared with you. (If you're the owner, you set this when you deployed the worker.)
            </p>
            <input
              type="password"
              value={val}
              onChange={(e) => setVal(e.target.value)}
              placeholder="token..."
              className="w-full border border-ink bg-bg0 p-3 font-mono text-sm mb-4 outline-none focus:border-terra"
            />
            <button
              onClick={() => val.trim() && onSet(val.trim())}
              className="w-full bg-terra text-bg0 px-6 py-3 font-mono text-xs uppercase tracking-[0.18em]"
            >
              Continue →
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
