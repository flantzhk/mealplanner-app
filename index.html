// =====================================================================
// v3.1-cook-tracking.txt
// React function components for cook tracking + freshness + prep planning.
//
//   - MarkCookedButton        : Today timeline cook-event button → records eaten
//   - FreshnessPill           : inline pill showing last-eaten status of a recipe
//   - RecentlyUsedCarousel    : horizontal-scroll row of recently-cooked recipes
//   - PrepTomorrow            : evening prep card listing tomorrow's overnight tasks
//   - TranslationVerifyToggle : per-step translation-verified toggle for Leni's view
//
// React 18 + Babel, no imports/exports. Top-level globals.
// Relies on: React, MP (from shared.js).
// Tailwind tokens used: bg-terra, bg-sand, bg-bg0, text-ink, text-warm,
// text-bg0, text-terra, border-border, border-warm, font-display, font-mono.
// Touch targets ≥ 44 on every interactive control.
// No border-radius (except small dot affordances per house rule).
// =====================================================================


// ---- helpers ----------------------------------------------------------

// Find the eaten-log timestamp for a (recipeId, date) pair, if any.
// eatenLog shape: { [recipeId]: ["YYYY-MM-DD", ...] } per shared.js.
// We only have date granularity, so the "HH:MM" in the disabled state is
// derived from a separate timestamp map IF the API ever returns one;
// otherwise we just say "Cooked today".
function eatenOnDate(eatenLog, recipeId, date) {
  if (!eatenLog || !recipeId || !date) return false;
  const arr = eatenLog[recipeId] || [];
  return arr.includes(date);
}

// Pretty "Xd ago" / "Xw ago" — MP.lastEaten gives us days, we format.
function fmtAgo(days) {
  if (days == null) return "";
  if (days === 0) return "today";
  if (days === 1) return "1d ago";
  if (days < 14) return `${days}d ago`;
  const w = Math.floor(days / 7);
  return `${w}w ago`;
}

// Format Date → "HH:MM" 24h, HK time. We use this when we have a real
// timestamp (from optimistic local state) for the "Cooked at HH:MM" label.
function fmtClockHM(d) {
  try {
    return new Intl.DateTimeFormat("en-GB", {
      timeZone: "Asia/Hong_Kong",
      hour: "2-digit", minute: "2-digit", hour12: false,
    }).format(d);
  } catch (e) {
    return "";
  }
}


// ---- 1. MarkCookedButton ---------------------------------------------
// Lives inside Today's timeline cook events.
// If eatenLog already has (recipeId, day): disabled "✓ Cooked …" label.
// Else: primary terra button. Tap → MP.api.recordEaten then onCooked().
//
// We keep a tiny local "justCooked" state so the post-tap label can show
// the actual HH:MM the user tapped at, before parent state refreshes.
function MarkCookedButton({ recipeId, day, eatenLog, onCooked }) {
  const [busy, setBusy] = React.useState(false);
  const [justCookedAt, setJustCookedAt] = React.useState(null); // Date or null
  const [err, setErr] = React.useState(null);

  const alreadyCooked = eatenOnDate(eatenLog, recipeId, day);
  const isCooked = alreadyCooked || justCookedAt;

  if (isCooked) {
    // We don't have HH:MM from the server-side log (it stores dates),
    // so we show the precise time only when WE just recorded it this session.
    const label = justCookedAt
      ? `✓ Cooked at ${fmtClockHM(justCookedAt)}`
      : `✓ Cooked`;
    return (
      <div
        className="inline-flex items-center px-4 font-mono text-[11px] uppercase tracking-[0.16em] text-warm"
        style={{ minHeight: 44 }}
        aria-live="polite"
      >
        {label}
      </div>
    );
  }

  async function handle() {
    if (busy || !recipeId || !day) return;
    setBusy(true); setErr(null);
    const tapAt = new Date();
    try {
      await MP.api.recordEaten(recipeId, day);
      setJustCookedAt(tapAt);
      if (typeof onCooked === "function") onCooked();
    } catch (e) {
      setErr(e && e.message ? e.message : "Failed");
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="inline-flex flex-col items-start gap-1">
      <button
        type="button"
        onClick={handle}
        disabled={busy}
        className="inline-flex items-center justify-center px-5 bg-terra text-bg0 font-mono text-[11px] uppercase tracking-[0.16em] hover:bg-ink disabled:opacity-50"
        style={{ minHeight: 44 }}
      >
        {busy ? "Saving…" : "Mark cooked"}
      </button>
      {err ? (
        <div className="font-mono text-[10px] tracking-[0.14em] text-terra">
          {err}
        </div>
      ) : null}
    </div>
  );
}


// ---- 2. FreshnessPill ------------------------------------------------
// Wrapper around MP.lastEaten. Output: small inline pill.
// Plain Inter 12 px (so we don't add editorial chrome to recipe cards).
//
// Status mapping (shared.js MP.lastEaten):
//   "never"   → "Never cooked"            sage, hairline border
//   "fresh"   → "Fresh · Xd ago"          terra fg, hairline-vermilion border
//             (treated as <2 weeks per spec; MP returns this for future-dated
//              i.e. planned, but we also synthesise it for days < 14 below)
//   "recent"  → "Recent · Xd ago"         warm, hairline-warm border
//   "warming" → "Warming · Xd ago"        warm, dashed border
//   "stale"   → "Stale · Xw ago"          sage italic
//
// Note: MP.lastEaten currently returns "fresh" only for future-dated entries.
// For the spec ("fresh < 2 weeks"), we widen here: any cooked-in-last-14-days
// gets the "fresh" treatment when days < 14, otherwise we honour what
// MP.lastEaten returned. Kept small + local — no shared.js change needed.
function FreshnessPill({ recipe, eatenLog, className }) {
  if (!recipe || !recipe.id) return null;
  const today = MP.date.hkToday();
  const info = MP.lastEaten(recipe.id, eatenLog || {}, today);

  let label, style;
  const base = "inline-flex items-center px-2 py-0.5 text-[12px] leading-none border";

  if (info.status === "never") {
    label = "Never cooked";
    style = "text-warm/70 border-border"; // sage = warm-muted in this palette
  } else if (info.status === "fresh" || (info.days != null && info.days < 14 && info.status !== "stale")) {
    // Widen "fresh" to <2 weeks (matches spec). Override warming/recent here.
    label = `Fresh · ${fmtAgo(info.days)}`;
    style = "text-terra border-terra";
  } else if (info.status === "recent") {
    label = `Recent · ${fmtAgo(info.days)}`;
    style = "text-warm border-warm/60";
  } else if (info.status === "warming") {
    label = `Warming · ${fmtAgo(info.days)}`;
    style = "text-warm border-warm/60 border-dashed";
  } else {
    // stale
    label = `Stale · ${fmtAgo(info.days)}`;
    style = "italic text-warm/70 border-border";
  }

  return (
    <span className={`${base} ${style} ${className || ""}`}>
      {label}
    </span>
  );
}


// ---- 3. RecentlyUsedCarousel -----------------------------------------
// Horizontal-scroll row inside RecipePicker top.
// Sorted by most-recent eaten date desc. Up to 8 cards.
// Hidden entirely when eatenLog has no entries.
//
// Card: 100×100 thumbnail + small recipe name (font-display 14 px).
// Tap → onPick(recipe). Each card is ≥ 44 tall (it's 100, comfortably so).
function RecentlyUsedCarousel({ recipes, eatenLog, onPick, onClose }) {
  if (!eatenLog) return null;

  // Build [{recipe, lastDate}], drop unknowns, sort desc, cap 8.
  const items = React.useMemo(() => {
    const byId = {};
    for (const r of recipes || []) byId[r.id] = r;
    const out = [];
    for (const id of Object.keys(eatenLog)) {
      const dates = eatenLog[id] || [];
      if (!dates.length) continue;
      const last = dates.reduce((a, b) => (a > b ? a : b));
      const r = byId[id];
      if (!r) continue;
      out.push({ recipe: r, lastDate: last });
    }
    out.sort((a, b) => (a.lastDate < b.lastDate ? 1 : -1));
    return out.slice(0, 8);
  }, [recipes, eatenLog]);

  if (items.length === 0) return null;

  function thumbFor(r) {
    if (r.youtube_url) {
      const t = MP.youtubeThumb(r.youtube_url, "hqdefault");
      if (t) return t;
    }
    return r.hero_image || null;
  }

  return (
    <div className="mb-5">
      <div className="flex items-center justify-between mb-2">
        <div className="font-mono text-[10px] uppercase tracking-[0.18em] text-warm">
          Recently cooked
        </div>
        {onClose ? (
          <button
            type="button"
            onClick={onClose}
            className="font-mono text-[10px] uppercase tracking-[0.16em] text-warm hover:text-ink px-2"
            style={{ minHeight: 44 }}
            aria-label="Close recently cooked"
          >
            Close
          </button>
        ) : null}
      </div>

      <div
        className="flex gap-3 overflow-x-auto pb-1"
        style={{ WebkitOverflowScrolling: "touch", scrollbarWidth: "thin" }}
      >
        {items.map(({ recipe }) => {
          const src = thumbFor(recipe);
          return (
            <button
              key={recipe.id}
              type="button"
              onClick={() => onPick && onPick(recipe)}
              className="flex flex-col items-start text-left flex-shrink-0 hover:opacity-90"
              style={{ width: 100, minHeight: 44 }}
            >
              <div
                className="bg-sand relative overflow-hidden"
                style={{ width: 100, height: 100 }}
              >
                {src ? (
                  <img
                    src={src}
                    alt={recipe.name || ""}
                    className="absolute inset-0 w-full h-full object-cover"
                    onError={(e) => { e.currentTarget.style.display = "none"; }}
                  />
                ) : null}
              </div>
              <div
                className="font-display text-[14px] leading-tight text-ink mt-1.5 line-clamp-2"
                style={{
                  display: "-webkit-box",
                  WebkitLineClamp: 2,
                  WebkitBoxOrient: "vertical",
                  overflow: "hidden",
                }}
              >
                {recipe.name || recipe.id}
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
}


// ---- 4. PrepTomorrow -------------------------------------------------
// Card visible on Today view AFTER dinner-serve hour (>= 19:00 HK).
// Lists tomorrow's overnight prep tasks (defrost / marinate) by reading
// MP.schedule.buildDayTasks(tomorrow, dayAfter, byId, {}) and filtering
// to the "nextDay" task types — i.e. tasks whose target meal is on the
// day AFTER tomorrow but whose execution lands tomorrow night.
//
// In MP.schedule.buildDayTasks, "next-day" prep is emitted when called
// with (currentDay, nextDay, ...) — defrost @ 8am and overnight-marinate
// @ 8pm. So to get "what Faith should do TONIGHT for TOMORROW", we call
// buildDayTasks(today, tomorrow, ...) and pick the ones that target tomorrow.
//
// Spec asks us to call buildDayTasks(tomorrowDay, dayAfter, ...) — that
// gives "what Leni should do tomorrow night for the day-after". We honour
// the spec literally: this card shows what needs to happen overnight from
// tomorrow into the following day. Title = "Tonight, before bed" stays
// readable because Faith's planning context is the night before action.
function PrepTomorrow({ plan, todayKey, recipes }) {
  const hourNow = MP.date.hkHour();
  if (hourNow < 19) return null; // only after dinner

  if (!plan || !plan.days || !todayKey) return null;

  const tomorrowKey = MP.date.addDays(todayKey, 1);
  const dayAfterKey = MP.date.addDays(todayKey, 2);

  const days = plan.days || [];
  const tomorrow = days.find((d) => d.date === tomorrowKey);
  const dayAfter = days.find((d) => d.date === dayAfterKey);

  // No plan for tomorrow → don't surface (user hasn't planned yet).
  if (!tomorrow) return null;

  const byId = {};
  for (const r of recipes || []) byId[r.id] = r;

  // Per spec: buildDayTasks(tomorrowDay, dayAfter, byId, {}) filtered to
  // nextDay task types (defrost / overnight marinate). These are the tasks
  // that buildDayTasks generates from `nextDay`'s recipes — they appear in
  // the result with kinds "defrost" or "marinate" and a label containing
  // "tomorrow's". We match on that signature.
  const tasks = MP.schedule.buildDayTasks(tomorrow, dayAfter || null, byId, {}) || [];
  const prepTasks = tasks.filter((t) =>
    (t.kind === "defrost" || t.kind === "marinate") &&
    typeof t.label === "string" &&
    t.label.indexOf("tomorrow's") !== -1
  );

  // Tomorrow's day name + a short date for the serif h3.
  const dayName = MP.date.dayName(tomorrowKey, "en");
  const niceDate = MP.date.prettyDate(tomorrowKey, "en");

  function pillFor(kind) {
    const text = kind === "defrost" ? "DEFROST" : "MARINATE";
    return (
      <span className="inline-flex items-center px-2 py-0.5 bg-terra text-bg0 font-mono text-[10px] uppercase tracking-[0.16em]">
        {text}
      </span>
    );
  }

  function recipeNameFor(t) {
    const r = t.recipeId ? byId[t.recipeId] : null;
    if (r && r.name) return r.name;
    // Fall back: extract from label "Take X out of freezer (for tomorrow's …)"
    const m = t.label && t.label.match(/^(?:Take|Start marinating)\s+(.+?)(?:\s+\(for|\s+tonight\s+\(for|$)/);
    return m ? m[1] : (t.recipeId || "");
  }

  function hoursBefore(t) {
    // hours_before isn't stored on the task — derive from kind + at:
    // defrost is queued at 8am for next-day cook, marinate-overnight at 8pm.
    if (t.kind === "defrost") return "12h+ before";
    if (t.kind === "marinate") return "8h+ before";
    return "";
  }

  return (
    <div className="bg-sand border-l-4 border-terra p-5 my-6">
      <div className="font-mono text-[10px] uppercase tracking-[0.18em] text-warm mb-1">
        Tonight, before bed
      </div>
      <h3 className="font-display text-[22px] leading-tight text-ink mb-3">
        For {dayName}, {niceDate}
      </h3>

      {prepTasks.length === 0 ? (
        <div className="text-warm text-[14px]">All set for tomorrow.</div>
      ) : (
        <ul className="flex flex-col gap-2.5">
          {prepTasks.map((t, i) => (
            <li
              key={i}
              className="flex items-start gap-3"
              style={{ minHeight: 44 }}
            >
              <div className="pt-0.5">{pillFor(t.kind)}</div>
              <div className="flex-1 min-w-0">
                <div className="text-ink text-[14px] leading-snug">
                  {recipeNameFor(t)}
                </div>
                <div className="font-mono text-[10px] uppercase tracking-[0.16em] text-warm mt-0.5">
                  {hoursBefore(t)} · for {t.meal || "meal"}
                </div>
              </div>
            </li>
          ))}
        </ul>
      )}
    </div>
  );
}


// ---- 5. TranslationVerifyToggle --------------------------------------
// Used in Video Player sidebar. For each step, when lang !== "en" we
// render a small toggle. Tap → onVerify(stepIndex, lang, true).
// Parent owns persistence; we keep a tiny optimistic local "verified" flag
// so the UI flips instantly. If the recipe carries verified flags
// (e.g. recipe.steps[i].verified_tl === true), we honour those as the
// initial state.
function TranslationVerifyToggle({ recipe, stepIndex, lang, onVerify }) {
  if (!recipe || lang === "en") return null;
  const step = recipe.steps && recipe.steps[stepIndex];
  if (!step) return null;

  const verifiedKey = `verified_${lang}`;
  const initial = !!(step && step[verifiedKey]);
  const [verified, setVerified] = React.useState(initial);

  // Re-sync if the underlying recipe changes (e.g. parent persisted it).
  React.useEffect(() => { setVerified(!!(step && step[verifiedKey])); }, [recipe && recipe.id, stepIndex, lang]);

  function handle() {
    const next = !verified;
    setVerified(next); // optimistic
    if (typeof onVerify === "function") onVerify(stepIndex, lang, next);
  }

  const label = verified ? "✓ Verified" : "Mark verified";
  const cls = verified
    ? "bg-terra text-bg0 border-terra"
    : "bg-bg0 text-warm border-border hover:text-ink";

  return (
    <button
      type="button"
      onClick={handle}
      className={`inline-flex items-center px-3 border font-mono text-[10px] uppercase tracking-[0.16em] ${cls}`}
      style={{ minHeight: 44 }}
      aria-pressed={verified}
    >
      {label}
    </button>
  );
}



    // ─── from v3.1-scaling-preview.txt ─────────────────────────────────────

// ─────────────────────────────────────────────────────────────────────────────
// v3.1-scaling-preview.txt
// React 18 + Babel-in-browser. Function components, no imports, top-level globals.
// Tailwind tokens: cream sand ink terra sage warm bg0 border. Vermilion = terra.
// No border-radius (except rounded-full where noted). Touch targets >= 44.
// Uses globals: MP.scale, MP.units.fromCanonical, MP.units.toCanonical,
//               MP.schedule.dayConflicts, MP.youtubeThumb, MP.recipeImage,
//               MP.lastEaten, MP.formatDuration.
// ─────────────────────────────────────────────────────────────────────────────


// ---- Local helpers (top-level — no imports) --------------------------------

// Lang-aware lookup. Recipes may have `name`, `name_tl`, `name_il`, plus
// `steps`, `steps_tl`, `steps_il` and `ingredients[i].item_tl/_il`.
function rpName(recipe, lang) {
  if (!recipe) return "";
  if (lang === "tl" && recipe.name_tl) return recipe.name_tl;
  if (lang === "il" && recipe.name_il) return recipe.name_il;
  return recipe.name || "";
}

function rpIngredientLabel(ing, lang) {
  if (!ing) return "";
  if (lang === "tl" && ing.item_tl) return ing.item_tl;
  if (lang === "il" && ing.item_il) return ing.item_il;
  return ing.item || "";
}

// Returns { steps: array, fellBack: bool }. If translated array missing,
// fall back to English so Leni still sees something.
function rpStepsForLang(recipe, lang) {
  if (!recipe) return { steps: [], fellBack: false };
  if (lang === "tl" && Array.isArray(recipe.steps_tl) && recipe.steps_tl.length) {
    return { steps: recipe.steps_tl, fellBack: false };
  }
  if (lang === "il" && Array.isArray(recipe.steps_il) && recipe.steps_il.length) {
    return { steps: recipe.steps_il, fellBack: false };
  }
  return { steps: recipe.steps || [], fellBack: lang && lang !== "en" };
}

// Source pill mini — used inside ingredient rows. Single-letter glyph + label.
function rpSourcePillMini(source) {
  const s = (source || "").toLowerCase();
  let label = "Other", cls = "bg-bg0 text-warm border border-border";
  if (s === "wet-market" || s === "market") { label = "Wet";   cls = "bg-terra text-cream"; }
  else if (s === "fusion" || s === "marketplace" || s === "supermarket") {
    label = "Super"; cls = "bg-sand text-ink";
  }
  else if (s === "hktv" || s === "hktvmall") { label = "HKTV";  cls = "bg-bg0 text-ink border border-border"; }
  else if (s === "pantry" || s === "on-hand") { label = "Pantry"; cls = "bg-cream text-warm"; }
  return (
    <span className={`font-mono uppercase tracking-[0.14em] text-[9px] px-1.5 py-0.5 ${cls}`}>
      {label}
    </span>
  );
}

// Format a numeric amount with the right precision. Avoids "0.5000" + trailing 0.
function rpFmtAmt(n) {
  if (n == null || isNaN(n)) return "";
  const r = Math.round(n * 100) / 100;
  if (r >= 100) return String(Math.round(r));
  if (Number.isInteger(r)) return String(r);
  return r.toFixed(2).replace(/\.?0+$/, "");
}

// Scale a single ingredient and pretty-print {amount, unit}. Honours
// `ing.scales` ('linear' | 'taper' | 'fixed') via MP.scale.
function rpScaleIngredient(ing, baseServes, currentServes) {
  if (!ing) return { amt: "", unit: "" };
  if (window.MP && MP.scale) {
    const scaled = MP.scale(ing, currentServes, baseServes);
    // Try to canonicalise then re-format so units stay sensible (g → kg etc).
    if (MP.units && MP.units.toCanonical && MP.units.fromCanonical && scaled.unit) {
      try {
        const can = MP.units.toCanonical(scaled.amount, scaled.unit);
        if (can.family === "volume" || can.family === "weight") {
          const out = MP.units.fromCanonical(can.family, can.value);
          return { amt: rpFmtAmt(out.amount), unit: out.unit };
        }
      } catch (e) { /* fall through */ }
    }
    return { amt: rpFmtAmt(scaled.amount), unit: scaled.unit || "" };
  }
  // Fallback (no shared.js): plain linear scale.
  const ratio = currentServes / (baseServes || 4);
  return { amt: rpFmtAmt((ing.amount || 0) * ratio), unit: ing.unit || "" };
}


// ─────────────────────────────────────────────────────────────────────────────
// 1. ServesScaler — compact ± pills around a serves count.
// ─────────────────────────────────────────────────────────────────────────────
// Layout: [−] {N} servings [+]. Min 1, max 12.
function ServesScaler({ recipe, currentServes, onChange, className }) {
  const base = (recipe && recipe.serves_base) || 4;
  const cur = Math.max(1, Math.min(12, currentServes || base));
  const dec = () => onChange && onChange(Math.max(1, cur - 1));
  const inc = () => onChange && onChange(Math.min(12, cur + 1));
  return (
    <div className={`inline-flex items-stretch border border-border bg-cream ${className || ""}`}>
      <button type="button" onClick={dec} disabled={cur <= 1}
        aria-label="Decrease servings"
        style={{ minWidth: 44, minHeight: 44 }}
        className="flex items-center justify-center font-display text-[20px] text-ink hover:bg-bg0 disabled:opacity-40 disabled:cursor-not-allowed border-r border-border">
        −
      </button>
      <div className="flex items-baseline gap-1.5 px-4 min-w-[120px] justify-center" style={{ minHeight: 44 }}>
        <span className="font-display text-[18px] text-ink tabular-nums leading-none self-center">{cur}</span>
        <span className="font-mono uppercase tracking-[0.14em] text-[10px] text-warm self-center">
          {cur === 1 ? "serving" : "servings"}
        </span>
      </div>
      <button type="button" onClick={inc} disabled={cur >= 12}
        aria-label="Increase servings"
        style={{ minWidth: 44, minHeight: 44 }}
        className="flex items-center justify-center font-display text-[20px] bg-terra text-cream hover:bg-ink disabled:opacity-40 disabled:cursor-not-allowed border-l border-border">
        +
      </button>
    </div>
  );
}


// ─────────────────────────────────────────────────────────────────────────────
// 2. ScaledIngredientsList — recipe ingredients scaled to currentServes.
// ─────────────────────────────────────────────────────────────────────────────
// Each row: name (Inter 16px, left) · amount + unit (mono tabular, right).
// Pantry items ('on_hand' or `ing.in_pantry`) faded sage. Source pill mini.
function ScaledIngredientsList({ recipe, currentServes, lang, className }) {
  const items = (recipe && recipe.ingredients) || [];
  const base = (recipe && recipe.serves_base) || 4;
  if (!items.length) {
    return (
      <div className={`text-warm/60 font-mono text-[11px] uppercase tracking-[0.14em] ${className || ""}`}>
        No ingredients listed
      </div>
    );
  }
  return (
    <ul className={`divide-y divide-border ${className || ""}`}>
      {items.map((ing, i) => {
        const { amt, unit } = rpScaleIngredient(ing, base, currentServes);
        const inPantry = !!(ing.in_pantry || ing.source === "pantry" || ing.source === "on-hand");
        const name = rpIngredientLabel(ing, lang);
        return (
          <li key={i}
              className={`grid grid-cols-[1fr_auto_auto] gap-3 items-center py-3 ${inPantry ? "text-sage" : "text-ink"}`}>
            <span className={`text-[16px] leading-tight ${inPantry ? "line-through" : ""}`}>
              {name}
            </span>
            {ing.source ? rpSourcePillMini(ing.source) : <span />}
            <span className="font-mono text-[13px] tabular-nums text-right text-warm whitespace-nowrap min-w-[5rem]">
              {amt}{unit ? ` ${unit}` : ""}
            </span>
          </li>
        );
      })}
    </ul>
  );
}


// ─────────────────────────────────────────────────────────────────────────────
// FreshnessPill — small status pill for "last cooked N days ago".
// Local fallback because no shared FreshnessPill exists. Reads MP.lastEaten.
// ─────────────────────────────────────────────────────────────────────────────
function FreshnessPillRP({ recipeId, eatenLog, today }) {
  if (!recipeId || !eatenLog || !window.MP || !MP.lastEaten) return null;
  const t = today || (MP.date && MP.date.hkToday && MP.date.hkToday());
  const info = MP.lastEaten(recipeId, eatenLog, t);
  let label, cls;
  if (info.status === "never") { label = "Never cooked"; cls = "bg-cream text-warm border border-border"; }
  else if (info.status === "recent")  { label = `Cooked ${info.days}d ago`; cls = "bg-terra/10 text-terra"; }
  else if (info.status === "warming") { label = `Cooked ${info.days}d ago`; cls = "bg-sand text-ink"; }
  else if (info.status === "fresh")   { label = "Planned for this week";    cls = "bg-bg0 text-warm border border-border"; }
  else                                { label = `${info.days}d since last`; cls = "bg-sage/15 text-sage"; }
  return (
    <span className={`inline-block font-mono uppercase tracking-[0.14em] text-[10px] px-2 py-1 ${cls}`}>
      {label}
    </span>
  );
}

  // Reset when recipe changes (modal reused for different recipes).
  React.useEffect(() => { setServes(initialServes); }, [recipe && recipe.id, initialServes]);

  // ESC closes.
  React.useEffect(() => {
    function onKey(e) { if (e.key === "Escape" && onClose) onClose(); }

              style={{ minWidth: 44, minHeight: 44 }}
              className="bg-cream/95 hover:bg-cream text-ink flex items-center justify-center font-mono text-[18px] border border-border">
              ×
            </button>
          </div>
        </div>

        {/* Header — eyebrow + title */}
        <div className="px-6 md:px-9 pt-6">
          {eyebrowParts.length > 0 && (
            <div className="font-mono uppercase tracking-[0.18em] text-[10px] text-warm mb-2">
              {eyebrowParts.join(" · ")}

          )}
          <h2 className="font-display text-[28px] md:text-[32px] leading-[1.05] tracking-[-0.01em] text-ink">
            {rpName(recipe, lang)}
          </h2>
        </div>

        <div className="grid grid-cols-3 gap-6 px-6 md:px-9 mt-5">
          <div>
            <div className="font-mono uppercase tracking-[0.14em] text-[10px] text-warm">Active</div>
            <div className="font-display text-[18px] text-ink tabular-nums">{active ? fmt(active) : "—"}</div>
          </div>
          <div>
            <div className="font-mono uppercase tracking-[0.14em] text-[10px] text-warm">Total</div>
            <div className="font-display text-[18px] text-ink tabular-nums">{total ? fmt(total) : "—"}</div>
          </div>
          <div>
            <div className="font-mono uppercase tracking-[0.14em] text-[10px] text-warm">Base</div>
            <div className="font-display text-[18px] text-ink tabular-nums">

          <div className="px-6 md:px-9 mt-5">
            <button type="button" onClick={() => onPlay(recipe)}

                const text = typeof d === "string"

                  : (d.action && d.lead ? `${d.action} ${d.lead} before` : (d.label || JSON.stringify(d)));
                return (
                  <li key={i} className="text-[13px] text-ink leading-snug">
                    <span className="text-terra mr-1">⚠</span>{text}

          </div>

        {/* Ingredients */}
        <div className="px-6 md:px-9 mt-7">
          <h3 className="font-mono uppercase tracking-[0.16em] text-[11px] text-warm mb-3">Ingredients</h3>

        {/* Steps */}
        <div className="px-6 md:px-9 mt-7 pb-8">
          <h3 className="font-mono uppercase tracking-[0.16em] text-[11px] text-warm mb-3">
            Steps
            {stepsRes.fellBack && (
              <span className="ml-2 text-warm/60 normal-case tracking-normal">(English)</span>
            )}
          </h3>
          <ol className="space-y-4">
            {stepsRes.steps.map((s, i) => {
              const num = (s && s.step) || (i + 1);
              const text = typeof s === "string" ? s : (s.instruction || s.text || "");
              return (
                <li key={i} className="grid grid-cols-[2rem_1fr] gap-3">
                  <span className="font-display text-terra text-[20px] leading-none tabular-nums">{num}</span>
                  <div className="font-display text-[16px] leading-relaxed text-ink">{text}</div>
                </li>
              );
            })}

        </div>

        {/* Footer */}
        <div className="mt-auto border-t border-border px-6 md:px-9 py-4 flex flex-wrap gap-3 items-center bg-bg0/50">
          <button type="button" onClick={onClose}
            style={{ minHeight: 44 }}
            className="font-mono uppercase tracking-[0.16em] text-[11px] px-4 py-2.5 border border-border bg-cream text-ink hover:bg-bg0">
            Close
          </button>
          {recipe.youtube_url && onPlay && (
            <button type="button" onClick={() => onPlay(recipe)}
              style={{ minHeight: 44 }}
              className="ml-auto font-mono uppercase tracking-[0.16em] text-[11px] px-5 py-2.5 bg-terra text-cream hover:bg-ink">
              ▶ Watch video
            </button>
          )}
        </div>
      </div>
    </div>
  );
}


// ─────────────────────────────────────────────────────────────────────────────
// 4. ConflictBadge — Week-view day strip overlap indicator.
// ─────────────────────────────────────────────────────────────────────────────
// `day` is the day's plan object; `recipes` is byId map. Pill shown only when
// MP.schedule.dayConflicts(day, byId) returns issues.
function ConflictBadge({ day, recipes, className }) {
  if (!day || !recipes || !window.MP || !MP.schedule || !MP.schedule.dayConflicts) return null;
  let conflicts = [];
  try { conflicts = MP.schedule.dayConflicts(day, recipes) || []; }
  catch (e) { return null; }
  if (!conflicts.length) return null;
  const n = conflicts.length;
  return (
    <span
      title={`${n} stove ${n === 1 ? "conflict" : "conflicts"}`}
      className={`inline-flex items-center bg-terra text-cream font-mono uppercase tracking-[0.18em] text-[10px] px-2 py-1 ${className || ""}`}
      style={{ paddingLeft: 8, paddingRight: 8, paddingTop: 4, paddingBottom: 4 }}
    >
      ⚠ overlap{n > 1 ? ` ×${n}` : ""}
    </span>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// 6. MealIngredientStrip — small horizontal recipe-thumb preview row.
// ─────────────────────────────────────────────────────────────────────────────
// `recipes` is the meal items (array of {recipeId, role}). `byId` resolves
// to recipe objects. Used in expanded Week meal tiles.
function MealIngredientStrip({ recipes, byId, max, className }) {
  const items = Array.isArray(recipes) ? recipes : [];
  const cap = max || 5;
  const shown = items.slice(0, cap);
  const overflow = Math.max(0, items.length - cap);
  if (!shown.length) return null;
  return (
    <div className={`flex items-center gap-2 ${className || ""}`}>
      {shown.map((it, i) => {
        const r = byId && byId[it.recipeId];
        const src = r && window.MP && MP.recipeImage ? MP.recipeImage(r) : null;
        const alt = r ? (r.name || "") : "";
        return (
          <div key={i} className="w-8 h-8 bg-sand overflow-hidden border border-border shrink-0"
               title={alt}>
            {src ? (
              <img src={src} alt={alt} className="w-full h-full object-cover block"
                   onError={(e) => {
                     const s = e.target.src;
                     if (s.includes("maxresdefault")) { e.target.src = s.replace("maxresdefault", "hqdefault"); return; }
                     if (s.includes("hqdefault"))     { e.target.src = s.replace("hqdefault", "mqdefault"); return; }
                     e.target.style.display = "none";
                   }} />
            ) : (
              <div className="w-full h-full flex items-center justify-center font-mono text-[8px] uppercase tracking-[0.14em] text-warm/60">
                {(it.role || "?").slice(0, 1)}
              </div>
            )}
          </div>
        );
      })}
      {overflow > 0 && (
        <span className="font-mono text-[10px] uppercase tracking-[0.14em] text-warm tabular-nums">
          +{overflow}
        </span>
      )}
    </div>
  );
}


    // ════════════════════════════════════════════════════════════════════════════
    // end v3.1 components
    // ════════════════════════════════════════════════════════════════════════════

    function planByDate(weekplan) {
      // Convert {days: [{date, breakfast, lunch, dinner}]} → {[date]: dayObj}
      if (!weekplan || !weekplan.days) return {};
      const out = {};
      for (const d of weekplan.days) {
        if (d && d.date) out[d.date] = d;
      }
      return out;
    }

    function App() {
      const [recipes, setRecipes] = useState([]);
      const [weekplan, setWeekplan] = useState(null);
      const [view, setView] = useState("week");
      const [activeRecipe, setActiveRecipe] = useState(null);
      const [showOnboarding, setShowOnboarding] = useState(
        () => !localStorage.getItem("mp_onboarded")
      );
      const [lang, setLang] = useState(() => localStorage.getItem("mp_lang") || "en");

      // v3.1 — gap-closing state
      const [picker, setPicker] = useState(null);            // {dayKey, mealType, role, swapIndex?}
      const [recipeForm, setRecipeForm] = useState(null);    // null | recipe (new=blank object)
      const [recipePreview, setRecipePreview] = useState(null);
      const [eatenLog, setEatenLog] = useState([]);
      const [pantry, setPantry] = useState([]);
      const [sources, setSources] = useState({});
      const [extras, setExtras] = useState([]);
      const [weekStart, setWeekStart] = useState(() => MP.date.mondayOf(MP.date.hkToday()));

      // Load data — try cloud first, fall back to bundled seed so app always opens with content.
      useEffect(() => {
        const loadSeed = () =>
          fetch("./recipes.seed.json").then((r) => r.json()).catch(() => []);

        if (MP.api.hasToken()) {
          Promise.all([
            MP.api.getRecipes().catch(() => null),
            MP.api.getWeekplanFor ? MP.api.getWeekplanFor(weekStart).catch(() => null) : MP.api.getWeekplan().catch(() => null),
            MP.api.getEatenLog().catch(() => []),
            MP.api.getPantry().catch(() => []),
            MP.api.getSources().catch(() => ({})),
            MP.api.getExtras().catch(() => []),
          ]).then(async ([recs, plan, log, pan, src, ext]) => {
            const finalRecs = Array.isArray(recs) && recs.length ? recs : await loadSeed();
            setRecipes(finalRecs);
            setWeekplan(plan);
            setEatenLog(Array.isArray(log) ? log : []);
            setPantry(Array.isArray(pan) ? pan : []);
            setSources(src && typeof src === "object" ? src : {});
            setExtras(Array.isArray(ext) ? ext : []);
          });
        } else {
          loadSeed().then((recs) => {
            setRecipes(Array.isArray(recs) ? recs : []);
            setWeekplan(null);
          });
        }
      }, [weekStart]);

      const todayKey = MP.date.hkToday();
      const planMap = useMemo(() => planByDate(weekplan), [weekplan]);
      const recipesById = useMemo(() => {
        const m = {};
        for (const r of recipes) m[r.id] = r;
        return m;
      }, [recipes]);

      const completeOnboarding = () => {
        localStorage.setItem("mp_onboarded", "1");
        setShowOnboarding(false);
      };
      const onLangChange = (l) => {
        setLang(l);
        localStorage.setItem("mp_lang", l);
      };

      if (showOnboarding) {
        return <Onboarding onContinue={completeOnboarding} />;
      }

      // ── Modal openers
      const playRecipe = (recipe) => setActiveRecipe(recipe);
      const closePlayer = () => setActiveRecipe(null);
      const openPicker = (dayKey, mealType, role) => setPicker({ dayKey, mealType, role: role || "main" });
      const closePicker = () => setPicker(null);
      const openRecipeForm = (recipe) => setRecipeForm(recipe || { id: "", name: "", meal_type: ["dinner"], ingredients: [], steps: [] });
      const closeRecipeForm = () => setRecipeForm(null);
      const openRecipePreview = (recipe) => setRecipePreview(recipe);
      const closeRecipePreview = () => setRecipePreview(null);

      // ── Plan mutations
      const persistPlan = (newPlan) => {
        setWeekplan(newPlan);
        if (MP.api.hasToken()) MP.api.putWeekplan(newPlan).catch((e) => console.error("save plan", e));
      };

      const ensurePlanShape = () => {
        // Make sure weekplan exists with days[]
        if (weekplan && Array.isArray(weekplan.days)) return weekplan;
        const ws = weekStart;
        const days = [];
        for (let i = 0; i < 7; i++) {
          const d = MP.date.addDays(ws, i);
          days.push({ date: d, day: MP.date.dayName(d).toLowerCase(), breakfast: [], lunch: [], dinner: [] });
        }
        return { week_start: ws, serves: 4, days };
      };

      const onAssignRecipe = ({ recipeId, role }) => {
        if (!picker) return;
        const plan = JSON.parse(JSON.stringify(ensurePlanShape()));
        const day = plan.days.find((d) => d.date === picker.dayKey);
        if (!day) { closePicker(); return; }
        const current = MP.getMealRecipes(day[picker.mealType]);
        if (picker.swapIndex != null) {
          current[picker.swapIndex] = { recipeId, role };
        } else {
          current.push({ recipeId, role });
        }
        day[picker.mealType] = current;
        persistPlan(plan);
        closePicker();
      };

      const onRemoveRecipe = (dayKey, mealType, idx) => {
        if (!weekplan) return;
        const plan = JSON.parse(JSON.stringify(weekplan));
        const day = plan.days && plan.days.find((d) => d.date === dayKey);
        if (!day) return;
        const current = MP.getMealRecipes(day[mealType]);
        current.splice(idx, 1);
        day[mealType] = current;
        persistPlan(plan);
      };

      // ── Recipe CRUD
      const onSaveRecipe = (body) => {
        const id = body.id || (body.name || "untitled").toLowerCase().replace(/[^a-z0-9]+/g, "-");
        const final = { ...body, id };
        if (MP.api.hasToken()) {
          MP.api.upsertRecipe(id, final).then(() => {
            setRecipes((rs) => {
              const i = rs.findIndex((r) => r.id === id);
              if (i >= 0) { const cp = rs.slice(); cp[i] = final; return cp; }
              return rs.concat(final);
            });
            closeRecipeForm();
          }).catch((e) => alert("Save failed: " + e.message));
        } else {
          setRecipes((rs) => {
            const i = rs.findIndex((r) => r.id === id);
            if (i >= 0) { const cp = rs.slice(); cp[i] = final; return cp; }
            return rs.concat(final);
          });
          closeRecipeForm();
        }
      };

      const onDeleteRecipe = (id) => {
        if (!confirm("Delete this recipe? This cannot be undone.")) return;
        if (MP.api.hasToken()) {
          MP.api.deleteRecipe(id).then(() => {
            setRecipes((rs) => rs.filter((r) => r.id !== id));
            closeRecipeForm();
          }).catch((e) => alert("Delete failed: " + e.message));
        } else {
          setRecipes((rs) => rs.filter((r) => r.id !== id));
          closeRecipeForm();
        }
      };

      // ── Cook tracking
      const onCooked = (recipeId, day) => {
        if (MP.api.hasToken()) {
          MP.api.recordEaten(recipeId, day).then(() =>
            MP.api.getEatenLog().then((log) => setEatenLog(Array.isArray(log) ? log : []))
          ).catch((e) => console.error("record eaten", e));
        } else {
          setEatenLog((l) => l.concat({ recipe_id: recipeId, date: day }));
        }
      };

      // ── Pantry / sources / extras
      const onTogglePantry = (item, have) => {
        setPantry((p) => {
          const i = p.findIndex((x) => (x.item || x) === item);
          if (have) {
            return i >= 0 ? p : p.concat({ item, have: true });
          } else {
            return p.filter((x) => (x.item || x) !== item);
          }
        });
        if (MP.api.hasToken()) MP.api.togglePantry(item, have).catch(() => {});
      };
      const onChangeSource = (item, source) => {
        setSources((s) => ({ ...s, [item]: source }));
        if (MP.api.hasToken()) MP.api.setSource(item, source).catch(() => {});
      };
      const onAddExtra = (item, source) => {
        if (MP.api.hasToken()) {
          MP.api.addExtra(item, source).then(() =>
            MP.api.getExtras().then((ex) => setExtras(Array.isArray(ex) ? ex : []))
          ).catch(() => {});
        } else {
          setExtras((e) => e.concat({ id: "local-" + Date.now(), item, source }));
        }
      };
      const onUpdateExtra = (id, patch) => {
        if (MP.api.hasToken()) MP.api.updateExtra(id, patch).then(() =>
          MP.api.getExtras().then((ex) => setExtras(Array.isArray(ex) ? ex : []))
        ).catch(() => {});
        else setExtras((es) => es.map((e) => e.id === id ? { ...e, ...patch } : e));
      };
      const onRemoveExtra = (id) => {
        if (MP.api.hasToken()) MP.api.removeExtra(id).then(() =>
          setExtras((es) => es.filter((e) => e.id !== id))
        ).catch(() => {});
        else setExtras((es) => es.filter((e) => e.id !== id));
      };

      // ── Week navigation
      const goPrevWeek = () => setWeekStart(MP.date.addDays(weekStart, -7));
      const goNextWeek = () => setWeekStart(MP.date.addDays(weekStart, 7));
      const goToday = () => setWeekStart(MP.date.mondayOf(MP.date.hkToday()));

      // ── Misc
      const print = () => window.print();
      const share = () => {
        const url = window.location.href;
        if (navigator.share) navigator.share({ title: "Meal Planner", url }).catch(() => {});
        else if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => alert("Link copied"));
        else prompt("Copy this URL:", url);
      };

      const members = [
        { name: "Faith Lantz", email: "faith@lantz.com", perm: "owner", initial: "F" },
        { name: "Leni", email: "leni@whatsapp · magic link", perm: "cook", initial: "L" },
      ];

      let content;
      if (view === "week") {
        content = (
          <React.Fragment>
            {typeof WeekNavBar !== "undefined" && (
              <WeekNavBar weekStart={weekStart} weekplan={weekplan} onPrev={goPrevWeek} onNext={goNextWeek} onJumpToToday={goToday} />
            )}
            <WeekView
              recipes={recipes}
              plan={planMap}
              todayKey={todayKey}
              onMealClick={(dayKey, mealType) => openPicker(dayKey, mealType, "main")}
              onPlayRecipe={playRecipe}
              onPrintWeek={print}
              onShare={share}
            />
          </React.Fragment>
        );
      } else if (view === "today") {
        content = (
          <TodayView
            recipes={recipes}
            plan={planMap}
            todayKey={todayKey}
            lang={lang}
            eatenLog={eatenLog}
            onLangChange={onLangChange}
            onPlayRecipe={playRecipe}
            onPrintToday={print}
            onShare={share}
            onCooked={onCooked}
          />
        );
      } else if (view === "pantry") {
        content = (
          <PantryView
            recipes={recipes}
            plan={planMap}
            weekRange={weekplan && { start: weekplan.week_start }}
            pantry={pantry}
            sources={sources}
            extras={extras}
            onPlayRecipe={playRecipe}
            onPrint={print}
            onSendToHelper={share}
            onTogglePantry={onTogglePantry}
            onChangeSource={onChangeSource}
            onAddExtra={onAddExtra}
            onUpdateExtra={onUpdateExtra}
            onRemoveExtra={onRemoveExtra}
          />
        );
      } else if (view === "recipes") {
        content = (
          <RecipesView
            recipes={recipes}
            eatenLog={eatenLog}
            onPlayRecipe={playRecipe}
            onSelectRecipe={openRecipePreview}
            onAddRecipe={() => openRecipeForm(null)}
          />
        );
      } else if (view === "settings") {
        content = (
          <React.Fragment>
            <SettingsView
              members={members}
              onInvite={(d) => console.log("invite", d)}
              onRevoke={(m) => console.log("revoke", m)}
              onCopyMagicLink={(p) => console.log("magic-link", p)}
            />
            {typeof SettingsPanel !== "undefined" && (
              <div className="border-t border-border bg-cream p-6">
                <SettingsPanel
                  initialBase={(localStorage.getItem("mpApiBase") || "")}
                  initialToken={(localStorage.getItem("mpFaithToken") || "")}
                  onSaved={() => window.location.reload()}
                />
              </div>
            )}
          </React.Fragment>
        );
      }

      return (
        <React.Fragment>
          <AppShell activeView={view} onNavigate={setView} header={null}>
            {content}
          </AppShell>

          {activeRecipe && (
            <VideoPlayerModal
              recipe={activeRecipe}
              lang={lang}
              onClose={closePlayer}
              onLangChange={onLangChange}
              onStartCooking={() => { closePlayer(); setView("today"); }}
            />
          )}

          {picker && typeof RecipePicker !== "undefined" && (
            <RecipePicker
              recipes={recipes}
              mealRole={picker.role}
              recentlyEatenIds={(eatenLog || []).slice(-12).map((e) => e.recipe_id)}
              eatenLog={eatenLog}
              onPick={onAssignRecipe}
              onClose={closePicker}
            />
          )}

          {recipeForm && typeof RecipeForm !== "undefined" && (
            <RecipeForm
              recipe={recipeForm}
              onSave={onSaveRecipe}
              onDelete={onDeleteRecipe}
              onClose={closeRecipeForm}
            />
          )}

          {recipePreview && typeof RecipePreview !== "undefined" && (
            <RecipePreview
              recipe={recipePreview}
              lang={lang}
              eatenLog={eatenLog}
              onClose={closeRecipePreview}
              onEdit={() => { const r = recipePreview; closeRecipePreview(); openRecipeForm(r); }}
              onPlay={() => { const r = recipePreview; closeRecipePreview(); playRecipe(r); }}
            />
          )}

          <footer className="text-center text-[11px] text-warm/40 py-6 select-none no-print">
            {APP_VERSION}
          </footer>
        </React.Fragment>
      );
    }

    function TokenSetup({ onSet }) {
      const [val, setVal] = useState("");
      return (
        <div className="min-h-screen flex items-center justify-center p-6">
          <div className="max-w-md w-full border border-border p-8 bg-bg0">
            <div className="text-[11px] font-mono uppercase tracking-[0.16em] text-warm mb-3">First-time setup</div>
            <h1 className="font-display text-3xl mb-4">Paste your access token.</h1>
            <p className="text-sm text-warm leading-relaxed mb-6">
              The meal plan is private. Paste the token your owner shared with you. (If you're the owner, you set this when you deployed the worker.)
            </p>
            <input
              type="password"
              value={val}
              onChange={(e) => setVal(e.target.value)}
              placeholder="token..."
              className="w-full border border-ink bg-bg0 p-3 font-mono text-sm mb-4 outline-none focus:border-terra"
            />
            <button
              onClick={() => val.trim() && onSet(val.trim())}
              className="w-full bg-terra text-bg0 text-[16px] font-medium px-6 py-4 hover:bg-terra/90 active:bg-terra/80"
            >
              Continue →
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
